    <p>Perang Dunia II (1939–1945) adalah konflik militer terbesar dalam sejarah manusia yang melibatkan lebih dari 70 negara dan menewaskan sekitar 70–85 juta jiwa.</p>
    <h3>Latar Belakang</h3>

    <h3>Akhir Perang</h3>

  `},
  { img:"kemal.jpg", kategori:"Sejarah", title:"Kejatuhan Kekaisaran Ottoman", tanggal:"1 Jun 2024", desc:"Bagaimana kekaisaran yang pernah menguasai tiga benua akhirnya runtuh dan melahirkan Turki modern.", isi:`

  { img:"a.o.t.d.m..jpg", kategori:"Sejarah", title:"Attack of the Dead Men", tanggal:"9 Jun 2024", desc:"100 tentara Rusia yang terkena gas klorin bangkit menyerang dan memukul mundur pasukan Jerman.", isi:`

    <p>Perang Napoleon (1803–1815) adalah serangkaian konflik besar yang melibatkan Kekaisaran Prancis di bawah Napoleon Bonaparte melawan berbagai koalisi kekuatan Eropa. Perang ini mengubah wajah benua secara drastis.</p>
    <h3>Kebangkitan Napoleon</h3><p>Setelah Revolusi Prancis, Napoleon dengan cepat naik pangkat menjadi jenderal brilian. Ia berhasil menguasai sebagian besar Eropa Barat dan Tengah melalui taktik militer yang inovatif.</p>
    <h3>Invasi ke Rusia</h3><p>Pada tahun 1812, Napoleon memimpin invasi besar-besaran ke Rusia. Namun, musim dingin yang ekstrem dan taktik bumi hangus dari tentara Rusia menghancurkan Grand Armée-nya.</p>

  { img:"revolution.jpg", kategori:"Sejarah", title:"Revolusi Prancis: Runtuhnya Feodalisme", tanggal:"15 Jan 2024", desc:"Periode perubahan sosial radikal yang menggulingkan monarki absolut Prancis.", isi:`

    <h3>Strategi Yunani</h3><p>Yunani memanfaatkan celah sempit di pegunungan Thermopylae untuk menetralisir keunggulan jumlah pasukan Persia. Phalanx hoplite Spartan yang disiplin menghancurkan gelombang serangan Persia.</p>

  { img:"rusia.jpg", kategori:"Sejarah", title:"Revolusi Rusia 1917: Lahirnya Uni Soviet", tanggal:"10 Feb 2024", desc:"Penggulingan monarki Tsar yang melahirkan negara komunis pertama.", isi:`
    <p>Revolusi Rusia pada tahun 1917 adalah salah satu peristiwa paling penting di abad ke-20. Revolusi ini menggulingkan monarki Tsar dan melahirkan negara komunis pertama di dunia, Uni Soviet.</p>
    <h3>Revolusi Oktober</h3><p>Kelompok Bolshevik yang dipimpin oleh Vladimir Lenin mengambil alih kekuasaan melalui kudeta. Mereka menjanjikan "Damai, Roti, dan Tanah" kepada rakyat.</p>
  `},
  { img:"pearlharbor.jpg", kategori:"Perang", title:"Pengeboman Pearl Harbor: Bangkitnya AS", tanggal:"12 Feb 2024", desc:"Serangan mendadak Jepang yang menyeret AS ke dalam Perang Dunia II.", isi:`
    <p>Serangan Pearl Harbor terjadi pada 7 Desember 1941, ketika Angkatan Laut Kekaisaran Jepang melancarkan serangan mendadak terhadap pangkalan Angkatan Laut AS di Hawaii.</p>
    <h3>Deklarasi Perang</h3><p>Keesokan harinya, Presiden Franklin D. Roosevelt berpidato dan menyebut tanggal tersebut sebagai "tanggal yang akan hidup dalam keburukan". Kongres menyatakan perang terhadap Jepang.</p>
  `},
  { img:"stalingrad.jpg", kategori:"Perang", title:"Pertempuran Stalingrad: Titik Balik PD II", tanggal:"15 Feb 2024", desc:"Pertempuran paling berdarah yang mematahkan mitos Nazi Jerman.", isi:`
    <p>Pertempuran Stalingrad (1942–1943) adalah salah satu pertempuran paling berdarah dalam sejarah manusia, sekaligus menjadi titik balik Perang Dunia II di Front Timur.</p>
    <h3>Operasi Uranus</h3><p>Soviet melancarkan Operasi Uranus, sebuah serangan besar-besaran untuk mengepung Tentara Keenam Jerman yang dipimpin Jenderal Paulus.</p>
  `},
  { img:"dday.jpg", kategori:"Sejarah", title:"Pendaratan Normandia (D-Day)", tanggal:"20 Feb 2024", desc:"Pendaratan amfibi terbesar dalam sejarah.", isi:`
    <p>Operasi Overlord atau yang lebih dikenal sebagai D-Day adalah pendaratan amfibi terbesar dalam sejarah, yang terjadi pada 6 Juni 1944 di pantai Normandia, Prancis.</p>
    <h3>Pantai Pendaratan</h3><p>Pendaratan terbagi menjadi lima pantai: Utah, Omaha, Gold, Juno, dan Sword. Pantai Omaha adalah yang paling berdarah bagi tentara Amerika.</p>
  `},
  { img:"hiroshima.jpg", kategori:"Senjata", title:"Bom Atom Hiroshima dan Nagasaki", tanggal:"25 Feb 2024", desc:"Satu-satunya penggunaan senjata nuklir dalam perang.", isi:`
    <p>Pada Agustus 1945, Amerika Serikat menjatuhkan bom atom di kota Hiroshima dan Nagasaki, Jepang. Ini adalah satu-satunya penggunaan senjata nuklir dalam perang di sejarah manusia.</p>
    <h3>Korban</h3><p>Sekitar 100.000 hingga 200.000 orang tewas seketika atau dalam beberapa bulan berikutnya akibat luka bakar, radiasi, dan penyakit.</p>
  `},
  { img:"korea.jpg", kategori:"Perang", title:"Perang Korea: Konflik Tak Berakhir", tanggal:"1 Mar 2024", desc:"Perang proksi Perang Dingin antara Korea Utara dan Selatan.", isi:`
    <p>Perang Korea (1950–1953) adalah perang antara Korea Utara (didukung China dan Uni Soviet) melawan Korea Selatan (didukung PBB dan AS).</p>
    <h3>Gencatan Senjata</h3><p>Perang berakhir dengan gencatan senjata pada 27 Juli 1953 di Panmunjom, namun secara resmi kedua negara masih dalam keadaan perang hingga saat ini.</p>
  `},
  { img:"vietnam.jpg", kategori:"Perang", title:"Perang Vietnam: Neraka di Hutan", tanggal:"5 Mar 2024", desc:"Konflik panjang yang melibatkan taktik gerilya Viet Cong.", isi:`
    <p>Perang Vietnam (1955–1975) adalah konflik panjang dan berdarah antara Vietnam Utara (komunis) melawan Vietnam Selatan (didukung AS).</p>
    <h3>Taktik Gerilya</h3><p>Viet Cong (gerilyawan komunis) menggunakan taktik perang gerilya di hutan rimba, membuat pasukan AS yang memiliki teknologi canggih kesulitan.</p>
  `},
  { img:"luther.jpg", kategori:"Sejarah", title:"Reformasi Protestan: Guncangan Gereja", tanggal:"10 Mar 2024", desc:"Gerakan Martin Luther yang menantang otoritas Gereja Katolik.", isi:`
    <p>Reformasi Protestan adalah gerakan keagamaan pada abad ke-16 yang menantang otoritas Gereja Katolik Roma dan Paus, yang berujung pada perpecahan besar dalam agama Kristen.</p>
    <h3>Martin Luther</h3><p>Seorang biarawan Jerman, Martin Luther, memprotes praktik penjualan indulgensi (surat pengampunan dosa) oleh Gereja. Pada tahun 1517, ia memakukan 95 Tesis di pintu gereja di Wittenberg.</p>
  `},
  { img:"mongol.jpg", kategori:"Militer", title:"Genghis Khan dan Kekaisaran Mongol", tanggal:"15 Mar 2024", desc:"Pendiri kekaisaran darat terbesar dalam sejarah.", isi:`
    <p>Genghis Khan (1162–1227) adalah pendiri Kekaisaran Mongol, kekaisaran darat terbesar dalam sejarah yang membentang dari Asia Timur hingga Eropa Timur.</p>
    <h3>Penyatuan Suku</h3><p>Lahir dengan nama Temüjin, ia berhasil menyatukan suku-suku Mongol yang bertikai dan diproklamasikan sebagai "Khan Agung" pada tahun 1206.</p>
  `},
  { img:"columbus.jpg", kategori:"Sejarah", title:"Penemuan Benua Amerika oleh Columbus", tanggal:"20 Mar 2024", desc:"Pelayaran Columbus pada 1492 yang membuka pintu kolonialisme.", isi:`
    <p>Pada tahun 1492, penjelajah Italia Christopher Columbus, yang disponsori oleh Kerajaan Spanyol, melakukan pelayaran melintasi Samudra Atlantik dan mencapai benua Amerika.</p>
    <h3>Pendaratan Pertama</h3><p>Ia mendarat di pulau yang ia beri nama San Salvador (sekarang Bahama), dan kemudian menjelajahi Kuba serta Hispaniola.</p>
  `},
  { img:"spartacus.jpg", kategori:"Militer", title:"Pasukan Spartacus: Pemberontakan Gladiator", tanggal:"25 Mar 2024", desc:"Pemberontakan budak terbesar melawan Republik Romawi.", isi:`
    <p>Pada tahun 73 SM, Spartacus, seorang gladiator Trakia yang diperbudak, memimpin pemberontakan besar melawan Republik Romawi.</p>
    <h3>Kemenangan Awal</h3><p>Pasukan budak Spartacus mengejutkan Roma dengan mengalahkan beberapa legiun Romawi, sehingga jumlah mereka membengkak menjadi puluhan ribu orang.</p>
  `},
  { img:"30years.jpg", kategori:"Perang", title:"Perang Tiga Puluh Tahun", tanggal:"1 Apr 2024", desc:"Perang besar Eropa yang awalnya dipicu konflik agama.", isi:`
    <p>Perang Tiga Puluh Tahun (1618–1648) adalah perang besar yang melibatkan hampir semua negara Eropa, awalnya dipicu oleh konflik agama antara Katolik dan Protestan.</p>
    <h3>Perdamaian Westfalen</h3><p>Perang berakhir dengan Perjanjian Westfalen pada tahun 1648, yang mengakui kedaulatan negara-negara dan menjadi dasar bagi sistem negara modern.</p>
  `},
  { img:"egypt.jpg", kategori:"Sejarah", title:"Peradaban Mesir Kuno dan Piramida", tanggal:"5 Apr 2024", desc:"Salah satu peradaban tertua dengan peninggalan arsitektur luar biasa.", isi:`
    <p>Mesir Kuno adalah salah satu peradaban paling maju dan bertahan lama dalam sejarah manusia, berkembang di sepanjang lembah Sungai Nil selama lebih dari 3.000 tahun.</p>
    <h3>Piramida Giza</h3><p>Piramida Agung Giza dibangun sebagai makam Firaun Khufu. Ini adalah satu-satunya Keajaiban Dunia Kuno yang masih berdiri hingga kini.</p>
  `},
  { img:"rome.jpg", kategori:"Sejarah", title:"Kekaisaran Romawi: Kejayaan dan Keruntuhan", tanggal:"10 Apr 2024", desc:"Dari Republik menjadi Kekaisaran besar yang menguasai Eropa.", isi:`
    <p>Kekaisaran Romawi adalah salah satu kekaisaran terbesar dan paling berpengaruh dalam sejarah, yang pada puncaknya menguasai wilayah luas di Eropa, Afrika Utara, dan Timur Tengah.</p>
    <h3>Dari Republik ke Kekaisaran</h3><p>Setelah pembunuhan Julius Caesar dan perang saudara, Augustus menjadi Kaisar pertama Romawi pada tahun 27 SM.</p>
    <h3>Pax Romana</h3><p>Periode perdamaian dan stabilitas yang berlangsung sekitar 200 tahun, di mana perdagangan dan arsitektur berkembang pesat.</p>
    <h3>Faktor Keruntuhan</h3><p>Krisis ekonomi, korupsi politik, invasi suku-suku barbar, dan pembagian kekaisaran menjadi dua (Timur dan Barat) melemahkan Roma.</p>
    <h3>Akhir Kekaisaran Barat</h3><p>Pada tahun 476 M, Kaisar terakhir Romawi Barat digulingkan oleh Odoacer, menandai berakhirnya era Romawi Kuno di Eropa Barat.</p>
  `},
  { img:"troya.jpg", kategori:"Perang", title:"Perang Troya: Mitos atau Nyata?", tanggal:"15 Apr 2024", desc:"Konflik legendaris antara Yunani dan Troya.", isi:`
    <p>Perang Troya adalah salah satu konflik paling terkenal dalam mitologi Yunani, diabadikan dalam puisi epik Homer, <i>Iliad</i>.</p>
    <h3>Penyebab Perang</h3><p>Perang dipicu oleh penculikan Helen dari Sparta oleh Paris dari Troya, yang melanggar hukum keramahan dan memicu sumpah para raja Yunani.</p>
    <h3>Kuda Troya</h3><p>Setelah pengepungan selama 10 tahun, Yunani menggunakan taktik licik: bersembunyi di dalam kuda kayu raksasa yang ditinggalkan di gerbang kota.</p>
    <h3>Bukti Arkeologi</h3><p>Pada abad ke-19, arkeolog Heinrich Schliemann menemukan reruntuhan kota yang diyakini sebagai Troya di Hisarlik, Turki modern.</p>
    <h3>Warisan</h3><p>Kisah Perang Troya mengajarkan tentang kesombongan (hubris), pengkhianatan, dan kehancuran yang dibawa oleh perang.</p>
  `},
  { img:"alexander.jpg", kategori:"Militer", title:"Alexander Agung: Penakluk Dunia", tanggal:"20 Apr 2024", desc:"Raja Makedonia yang menaklukkan Kekaisaran Persia hingga India.", isi:`
    <p>Alexander III dari Makedonia, yang dikenal sebagai Alexander Agung (356–323 SM), adalah salah satu komandan militer paling sukses dalam sejarah.</p>
    <h3>Awal Penaklukan</h3><p>Setelah naik takhta pada usia 20 tahun, ia segera menundukkan kota-kota Yunani yang memberontak dan memulai invasi ke Kekaisaran Persia.</p>
    <h3>Menaklukkan Persia</h3><p>Dalam pertempuran Issus dan Gaugamela, Alexander mengalahkan pasukan Persia yang jauh lebih besar di bawah Raja Darius III.</p>
    <h3>Hingga ke India</h3><p>Ambisi Alexander membawanya hingga ke sungai Indus di India. Pasukannya yang kelelahan akhirnya memaksa ia untuk kembali ke Babilonia.</p>
    <h3>Kematian dan Warisan</h3><p>Alexander meninggal secara misterius pada usia 32 tahun di Babilonia. Kekaisarannya terpecah, namun ia meninggalkan warisan penyebaran budaya Yunani (Hellenisme).</p>
  `},
  { img:"indus.jpg", kategori:"Sejarah", title:"Peradaban Lembah Indus", tanggal:"25 Apr 2024", desc:"Peradaban maju kuno di Asia Selatan dengan sistem drainase canggih.", isi:`
    <p>Peradaban Lembah Indus (sekitar 3300–1300 SM) adalah salah satu peradaban paling awal di dunia, berkembang di wilayah yang sekarang menjadi Pakistan dan India barat laut.</p>
    <h3>Kota Terencana</h3><p>Berbeda dengan peradaban lain, kota-kota seperti Mohenjo-daro dan Harappa dibangun dengan tata letak grid yang sangat terorganisir.</p>
    <h3>Sistem Sanitasi</h3><p>Peradaban ini memiliki sistem drainase dan saluran air limbah yang canggih, jauh mendahului zamannya.</p>
    <h3>Tulisan yang Belum Terpecahkan</h3><p>Mereka menggunakan simbol-simbol yang diukir pada segel batu, namun hingga kini tulisan Indus belum berhasil diuraikan oleh para ahli.</p>
    <h3>Misteri Kemunduran</h3><p>Kemunduran peradaban ini secara misterius dikaitkan dengan perubahan iklim, banjir, atau invasi bangsa Arya.</p>
  `},
  { img:"janissary.jpg", kategori:"Militer", title:"Pasukan Janissari: Pengawal Elit Ottoman", tanggal:"1 Mei 2024", desc:"Pasukan infanteri elit Kekaisaran Ottoman yang dilatih sejak muda.", isi:`
    <p>Janissari (Yeniçeri) adalah pasukan infanteri elit Kekaisaran Ottoman yang menjadi tulang punggung penaklukan Ottoman di Eropa, Asia, dan Afrika.</p>
    <h3>Sistem Devshirme</h3><p>Pasukan ini direkrut melalui sistem Devshirme, di mana anak-anak muda Kristen dari wilayah taklukan diambil, diislamkan, dan dilatih secara militer.</p>
    <h3>Disiplin dan Kekuatan</h3><p>Janissari adalah salah satu pasukan pertama yang menggunakan senjata api (musket) secara massal dan sangat disiplin dalam pertempuran.</p>
    <h3>Kekuasaan yang Berlebihan</h3><p>Seiring berjalannya waktu, Janissari menjadi sangat kuat dan mulai ikut campur dalam urusan politik serta melakukan kudeta terhadap Sultan.</p>
    <h3>Pembubaran</h3><p>Karena dianggap sebagai ancaman, Sultan Mahmud II membubarkan korps Janissari secara kejam dalam "Insiden yang Menguntungkan" pada tahun 1826.</p>
  `},
  { img:"100years.jpg", kategori:"Perang", title:"Perang Seratus Tahun", tanggal:"5 Mei 2024", desc:"Konflik berkepanjangan antara Inggris dan Prancis.", isi:`
    <p>Perang Seratus Tahun (1337–1453) adalah serangkaian konflik bersenjata antara Kerajaan Inggris dan Kerajaan Prancis yang berlangsung lebih dari satu abad.</p>
    <h3>Penyebab Konflik</h3><p>Perang dipicu oleh persaingan dinasti atas takhta Prancis serta perebutan wilayah strategis seperti Flanders yang kaya akan industri wol.</p>
    <h3>Keunggulan Busur Panjang</h3><p>Inggris memenangkan beberapa pertempuran besar (seperti Crécy dan Agincourt) berkat penggunaan busur panjang (longbow) yang mampu menembus baju baja ksatria Prancis.</p>
    <h3>Joan of Arc</h3><p>Seorang gadis petani Prancis, Joan of Arc, mengklaim mendapat wahyu ilahi. Ia memimpin pasukan Prancis meraih kemenangan penting di Orléans.</p>
    <h3>Akhir Perang</h3><p>Prancis akhirnya memenangkan perang, merebut kembali sebagian besar wilayahnya. Perang ini mempercepat transisi dari pasukan ksatria feodal ke tentara nasional yang profesional.</p>
  `},
  { img:"industry.jpg", kategori:"Sejarah", title:"Revolusi Industri: Awal Dunia Modern", tanggal:"10 Mei 2024", desc:"Pergeseran besar dari tenaga manusia ke mesin.", isi:`
    <p>Revolusi Industri adalah periode transisi dari ekonomi agraris ke ekonomi industri, yang dimulai di Inggris pada abad ke-18 dan menyebar ke seluruh dunia.</p>
    <h3>Mesin Uap</h3><p>Penemuan mesin uap oleh James Watt menjadi katalis utama, mengubah tenaga manusia dan hewan menjadi tenaga mesin yang tak terbatas.</p>
    <h3>Pabrik dan Urbanisasi</h3><p>Produksi beralih dari rumah ke pabrik-pabrik besar. Hal ini memicu urbanisasi masif, di mana jutaan orang pindah dari desa ke kota untuk mencari kerja.</p>
    <h3>Kondisi Kerja yang Buruk</h3><p>Revolusi Industri awal ditandai dengan eksploitasi buruh, termasuk penggunaan tenaga kerja anak-anak, jam kerja yang panjang, dan lingkungan kerja yang berbahaya.</p>
    <h3>Dampak Jangka Panjang</h3><p>Revolusi ini mengubah struktur sosial, melahirkan kelas menengah dan kelas pekerja, serta memicu kemajuan pesat dalam transportasi (kereta api) dan komunikasi.</p>
  `},
  { img:"opium.jpg", kategori:"Perang", title:"Perang Candu: Inggris vs Tiongkok", tanggal:"15 Mei 2024", desc:"Konflik yang membuka pintu Tiongkok bagi imperialis Barat.", isi:`
    <p>Perang Candu Pertama (1839–1842) adalah konflik militer antara Inggris dan Dinasti Qing Tiongkok, yang dipicu oleh upaya Tiongkok menghentikan perdagangan opium.</p>
    <h3>Masalah Opium</h3><p>Inggris mengekspor opium dari India ke Tiongkok untuk menyeimbangkan defisit perdagangan teh. Akibatnya, terjadi krisis kecanduan opium di Tiongkok.</p>
    <h3>Penghancuran Opium</h3><p>Komisaris Tiongkok, Lin Zexu, menyita dan menghancurkan berton-ton opium milik pedagang Inggris di Kanton.</p>
    <h3>Keunggulan Angkatan Laut Inggris</h3><p>Inggris merespons dengan mengirim armada laut modern. Tiongkok yang masih menggunakan teknologi abad pertengahan tidak mampu membendung kekuatan Inggris.</p>
    <h3>Perjanjian Nanjing</h3><p>Tiongkok terpaksa menandatangani Perjanjian Nanjing yang tidak setara, menyerahkan Hong Kong kepada Inggris dan membuka pelabuhan untuk pedagang asing. Ini menandai awal "Abad Penghinaan" bagi Tiongkok.</p>
  `},
  { img:"gurkha.jpg", kategori:"Militer", title:"Pasukan Gurkha: Tentara Legendaris Nepal", tanggal:"20 Mei 2024", desc:"Pasukan pemberani dari Nepal yang bertempur untuk Inggris.", isi:`
    <p>Pasukan Gurkha adalah tentara dari Nepal yang terkenal karena keberanian, ketangguhan, dan loyalitas mereka dalam pertempuran. Mereka telah bertempur untuk Kerajaan Inggris dan India selama hampir 200 tahun.</p>
    <h3>Sejarah Perekrutan</h3><p>Setelah Perang Inggris-Nepal (1814–1816), Inggris sangat terkesan dengan kemampuan tempur prajurit Nepal. Sejak saat itu, mereka mulai merekrut orang-orang Gurkha ke dalam pasukan Inggris.</p>
    <h3>Pisau Kukri</h3><p>Senjata ikonik mereka adalah Kukri, sebilah pisau melengkung yang sangat tajam. Kukri digunakan untuk memotong tanaman, memasak, sekaligus sebagai senjata mematikan jarak dekat.</p>
    <h3>Keberanian di Medan Perang</h3><p>Selama Perang Dunia I dan II, pasukan Gurkha menunjukkan keberanian luar biasa. Di medan perang yang sulit seperti hutan rimba dan pegunungan, mereka sering menjadi pasukan pemimpin.</p>
    <h3>Penghargaan Victoria Cross</h3><p>Banyak prajurit Gurkha yang menerima Victoria Cross, penghargaan militer tertinggi Inggris, atas tindakan kepahlawanan mereka di luar kewajiban.</p>
    <h3>Legenda yang Abadi</h3><p>Hingga saat ini, pasukan Gurkha masih bertugas di berbagai misi perdamaian dan operasi militer di seluruh dunia, mempertahankan reputasi mereka sebagai salah satu tentara paling ditakuti di dunia.</p>
  `},
  { img:"maya.jpg", kategori:"Sejarah", title:"Peradaban Maya: Astronomi dan Matematika", tanggal:"25 Mei 2024", desc:"Peradaban Amerika Tengah yang menguasai astronomi.", isi:`
    <p>Peradaban Maya berkembang di wilayah Meksiko selatan, Guatemala, Belize, dan Honduras. Mereka mencapai puncak kejayaannya antara tahun 250 hingga 900 Masehi.</p>
    <h3>Kota-Kota Megah</h3><p>Maya membangun kota-kota besar dengan piramida megah, kuil, dan istana, seperti Tikal, Palenque, dan Chichen Itza, yang menjadi pusat perdagangan dan agama.</p>
    <h3>Keahlian Astronomi</h3><p>Maya adalah astronom yang sangat hebat. Mereka mengamati pergerakan matahari, bulan, dan planet Venus dengan akurasi yang menakjubkan, jauh sebelum teleskop ditemukan.</p>
    <h3>Kalender Maya</h3><p>Mereka menciptakan sistem kalender yang sangat kompleks, termasuk Kalender Hitung Panjang dan Tzolk'in. Kalender ini sangat akurat dalam menghitung siklus waktu.</p>
    <h3>Konsep Angka Nol</h3><p>Maya adalah salah satu peradaban awal di dunia yang secara mandiri mengembangkan konsep matematika "nol" (zero) dan menggunakan sistem vigesimal (basis 20).</p>
    <h3>Keruntuhan</h3><p>Secara misterius, peradaban Maya di dataran rendah runtuh pada abad ke-9, kemungkinan besar akibat kekeringan parah, perang saudara, dan kerusakan lingkungan.</p>
  `},
  { img:"boer.jpg", kategori:"Perang", title:"Perang Boer: Perlawanan Afrika Selatan", tanggal:"30 Mei 2024", desc:"Perang antara Inggris melawan koloni Boer.", isi:`
    <p>Perang Boer (1899–1902) adalah perang antara Kekaisaran Inggris melawan dua republik Boer merdeka, yaitu Republik Afrika Selatan (Transvaal) dan Negara Bebas Oranye.</p>
    <h3>Penyebab Perang</h3><p>Penemuan tambang emas dan berlian besar di wilayah Boer memicu ambisi Inggris untuk menguasai seluruh Afrika Selatan (Imperialisme).</p>
    <h3>Taktik Gerilya Boer</h3><p>Meskipun kalah jumlah, petani Boer (komando) bertempur dengan sangat gigih. Mereka menggunakan taktik menembak dari jarak jauh, menunggang kuda, dan perang gerilya di medan terbuka.</p>
    <h3>Kamp Konsentrasi</h3><p>Untuk memutus dukungan rakyat terhadap gerilyawan Boer, pasukan Inggris membumihanguskan peternakan dan menempatkan wanita serta anak-anak Boer ke dalam kamp konsentrasi. Ribuan orang meninggal akibat kelaparan dan penyakit.</p>
    <h3>Perjanjian Vereeniging</h3><p>Perang berakhir pada tahun 1902 dengan Perjanjian Vereeniging. Republik Boer harus menyerah dan bergabung dengan Uni Afrika Selatan di bawah kekuasaan Inggris.</p>
  `},
  { img:"terracotta.jpg", kategori:"Militer", title:"Pasukan Terakota: Pasukan Bawah Tanah", tanggal:"5 Jun 2024", desc:"Pasukan tentara dari Dinasti Qin yang menjadi penemuan arkeologi.", isi:`
    <p>Pasukan Terakota adalah koleksi patung yang menggambarkan tentara Kaisar Qin Shi Huang, kaisar pertama Tiongkok. Patung-patung ini ditemukan pada tahun 1974 oleh petani lokal yang sedang menggali sumur.</p>
    <h3>Tujuan Dibuat</h3><p>Kaisar Qin membangun pasukan ini sebagai bekal di alam baka. Ia percaya bahwa pasukan tanah liat ini akan melindunginya di akhirat, layaknya pasukan sungguhan.</p>
    <h3>Skala Megah</h3><p>Diperkirakan terdapat lebih dari 8.000 patung tentara, 130 kereta kuda, dan 520 kuda, yang dikubur dalam formasi perang yang sangat rapi di area seluas 56 kilometer persegi.</p>
    <h3>Detail Luar Biasa</h3><p>Keajaiban dari patung ini adalah wajah mereka yang unik. Tidak ada dua patung yang wajahnya sama persis. Mereka juga membawa senjata asli dan mengenakan seragam sesuai pangkat militer mereka.</p>
    <h3>Warisan UNESCO</h3><p>Saat ini, situs Mausoleum Kaisar Qin telah menjadi Situs Warisan Dunia UNESCO dan salah satu penemuan arkeologi paling penting abad ke-20.</p>
  `},

// ================================================================
// RENDER KARTU & MODAL (OTOMATIS)
// ================================================================
const grid = document.getElementById('artikelGrid');
const emojiMap = { "Perang":"⚔️", "Sejarah":"📜", "Militer":"🎖️", "Senjata":"🔫" };

artikelData.forEach((art, index) => {
  const emoji = emojiMap[art.kategori] || "📖";
  
  grid.innerHTML += `
    <div class="artikel-card reveal" data-kategori="${art.kategori.toLowerCase()}" onclick="bukaArtikel(${index})">
      <div class="artikel-thumb">
        <img src="${art.img}" alt="${art.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <div class="emoji-bg">${emoji}</div>
      </div>
      <div class="artikel-body">
        <div class="artikel-meta">
          <span class="artikel-kategori">${art.kategori}</span>
          <span class="artikel-tanggal">${art.tanggal}</span>
        </div>
        <h3 class="artikel-title">${art.title}</h3>
        <p class="artikel-desc">${art.desc}</p>
        <a class="artikel-link">Baca Selengkapnya →</a>
      </div>
    </div>
  `;
});

function bukaArtikel(index) {
  const a = artikelData[index];
  document.getElementById('modalKategori').textContent = a.kategori;
  document.getElementById('modalTitle').textContent = a.title;
  document.getElementById('modalDate').textContent = a.tanggal;
  document.getElementById('modalBody').innerHTML = a.isi;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function tutupArtikel(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || (e.target && e.target.classList.contains('modal-close'))) {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
}

function filterArtikel(kat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.artikel-card').forEach(card => {
    card.style.display = (kat === 'semua' || card.dataset.kategori === kat) ? '' : 'none';
  });
}

document.addEventListener('keydown', e => { if(e.key==='Escape') tutupArtikel({}); });

const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
