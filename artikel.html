    .artikel-meta { display:flex; align-items:center; gap:.75rem; margin-bottom:.75rem; flex-wrap:wrap; }

    .artikel-link { font-size:.8rem; font-weight:600; color:var(--accent); }

    .modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.85); backdrop-filter:blur(8px); display:flex; align-items:flex-start; justify-content:center; padding:2rem 1rem; opacity:0; pointer-events:none; transition:opacity .3s; overflow-y:auto; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:100%; max-width:720px; transform:translateY(30px); transition:transform .3s; overflow:hidden; margin:auto; }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-header { padding:2rem; border-bottom:1px solid var(--border); position:relative; }
    .modal-close { position:absolute; top:1.5rem; right:1.5rem; background:var(--border); border:none; color:var(--muted); width:32px; height:32px; border-radius:50%; cursor:pointer; }

    .modal-kategori { font-size:.7rem; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:.75rem; }
    .modal-title { font-family:'Syne',sans-serif; font-size:clamp(1.4rem,3vw,2rem); font-weight:800; line-height:1.2; }
    .modal-date { font-size:.8rem; color:var(--muted); margin-top:0.5rem; }
    .modal-body { padding:2rem; }

    .modal-body h3 { font-family:'Syne',sans-serif; font-size:1.1rem; color:var(--text); margin:1.5rem 0 .75rem; }

</head>

      <div class="artikel-body">
        <div class="artikel-meta">
          <span class="artikel-kategori">${art.kategori}</span>
          <span class="artikel-tanggal">${art.tanggal}</span>
        </div>
        <h3 class="artikel-title">${art.title}</h3>
        <p class="artikel-desc">${art.desc}</p>
        <a class="artikel-link">Baca Selengkapnya →</a>
      </div>
    </div>
  `;
});

function bukaArtikel(index) {
  const a = artikelData[index];
  document.getElementById('modalKategori').textContent = a.kategori;
  document.getElementById('modalTitle').textContent = a.title;
  document.getElementById('modalDate').textContent = a.tanggal;
  document.getElementById('modalBody').innerHTML = a.isi;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function tutupArtikel(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || (e.target && e.target.classList.contains('modal-close'))) {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
}

function filterArtikel(kat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.artikel-card').forEach(card => {
    card.style.display = (kat === 'semua' || card.dataset.kategori === kat) ? '' : 'none';
  });
}

document.addEventListener('keydown', e => { if(e.key==='Escape') tutupArtikel({}); });

const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
