  { kategori:"Perang", title:"Perang Dunia II: Pertempuran yang Mengubah Dunia", tanggal:"10 Jun 2024", desc:"Mengenal kronologi, strategi, dan dampak Perang Dunia II yang menjadi konflik terbesar dalam sejarah manusia.", isi:`<p>Perang Dunia II (1939–1945) adalah konflik militer terbesar dalam sejarah manusia yang melibatkan lebih dari 70 negara dan menewaskan sekitar 70–85 juta jiwa.</p><h3>Latar Belakang</h3><p>Perang ini bermula dari ambisi ekspansif Nazi Jerman di bawah Adolf Hitler, fasisme Italia di bawah Mussolini, dan militerisme Jepang. Invasi Jerman ke Polandia pada 1 September 1939 memicu deklarasi perang dari Inggris dan Prancis.</p><h3>Front Utama</h3><ul><li><strong>Front Eropa Barat</strong> — Jerman menduduki Prancis, Belgia, dan Belanda.</li><li><strong>Front Timur</strong> — Pertempuran Jerman vs Uni Soviet, termasuk Pertempuran Stalingrad yang menjadi titik balik perang.</li><li><strong>Pasifik</strong> — Jepang vs Amerika Serikat setelah serangan Pearl Harbor 1941.</li></ul><h3>Akhir Perang</h3><p>Perang berakhir dengan menyerahnya Jerman pada Mei 1945, diikuti menyerahnya Jepang pada Agustus 1945 setelah bom atom dijatuhkan di Hiroshima dan Nagasaki.</p><h3>Dampak</h3><p>Perang ini melahirkan PBB, Perang Dingin, dekolonisasi Asia-Afrika, dan tatanan dunia baru yang masih kita rasakan hingga hari ini.</p>` },
  { kategori:"Militer", title:"Strategi Perang Sun Tzu yang Masih Relevan", tanggal:"5 Jun 2024", desc:"Pelajaran dari kitab The Art of War karya Sun Tzu yang hingga kini dipakai oleh militer dan pemimpin dunia.", isi:`<p>Sun Tzu adalah seorang jenderal dan filsuf militer Tiongkok yang hidup sekitar abad ke-5 SM. Karyanya, The Art of War, menjadi salah satu buku strategi paling berpengaruh sepanjang masa.</p><h3>Prinsip Utama Sun Tzu</h3><ul><li><strong>"Kenali dirimu dan kenali musuhmu"</strong> — Kemenangan membutuhkan pemahaman mendalam tentang diri sendiri dan lawan.</li><li><strong>"Perang terbaik adalah menang tanpa bertarung"</strong> — Strategi diplomatik dan psikologis lebih baik dari konfrontasi langsung.</li><li><strong>"Kecepatan adalah senjata"</strong> — Bergerak cepat dan tidak terduga membuat musuh kerepotan.</li></ul><h3>Relevansi Modern</h3><p>Ajaran Sun Tzu tidak hanya dipakai militer, tapi juga dunia bisnis, politik, dan olahraga. Banyak CEO dan pemimpin dunia mengaku terinspirasi oleh The Art of War.</p><h3>Penerapan dalam Militer Modern</h3><p>Doktrin perang asimetris, operasi intelijen, dan perang siber semuanya mencerminkan prinsip-prinsip yang Sun Tzu ajarkan 2.500 tahun yang lalu.</p>` },
  { kategori:"Sejarah", title:"Kejatuhan Kekaisaran Ottoman", tanggal:"1 Jun 2024", desc:"Bagaimana kekaisaran yang pernah menguasai tiga benua akhirnya runtuh dan melahirkan Turki modern.", isi:`<p>Kekaisaran Ottoman berdiri selama lebih dari 600 tahun (1299–1922) dan pada puncaknya menguasai wilayah dari Maroko hingga Persia, dari Hungaria hingga Yaman.</p><h3>Faktor Kemunduran</h3><ul><li><strong>Kekalahan dalam Perang Dunia I</strong> — Ottoman berpihak pada Jerman yang kalah perang.</li><li><strong>Nasionalisme</strong> — Bangkitnya semangat nasionalisme berbagai etnis di dalam kekaisaran.</li><li><strong>Korupsi dan birokrasi</strong> — Lemahnya pemerintahan pusat dan ketidakmampuan beradaptasi dengan modernitas.</li></ul><h3>Perjanjian Lausanne 1923</h3><p>Setelah Perang Kemerdekaan Turki di bawah Mustafa Kemal Atatürk, Perjanjian Lausanne 1923 mengakui kedaulatan Turki modern dan menandai berakhirnya era Ottoman.</p><h3>Warisan Ottoman</h3><p>Kekaisaran Ottoman meninggalkan warisan budaya, arsitektur, dan hukum yang masih terasa di lebih dari 40 negara yang pernah menjadi wilayahnya.</p>` },
  { kategori:"Militer", title:"Teknologi Senjata Modern yang Mengubah Peperangan", tanggal:"28 Mei 2024", desc:"Dari drone tempur hingga rudal hipersonik, teknologi militer modern yang mendefinisikan ulang strategi perang.", isi:`<p>Perkembangan teknologi militer pada abad ke-21 telah mendefinisikan ulang cara perang dilakukan, dari pertempuran fisik menjadi konflik yang melibatkan kecerdasan buatan, siber, dan luar angkasa.</p><h3>Drone Tempur</h3><p>Drone atau UAV kini menjadi tulang punggung operasi militer modern. Dari pengintaian hingga serangan presisi, drone mengurangi risiko bagi pilot manusia.</p><h3>Rudal Hipersonik</h3><p>Rudal yang bergerak di atas Mach 5 hampir tidak bisa dicegat sistem pertahanan konvensional. Rusia, China, dan AS berlomba mengembangkan teknologi ini.</p><h3>Perang Siber</h3><ul><li>Serangan terhadap infrastruktur digital musuh</li><li>Propaganda dan disinformasi digital</li><li>Pencurian data intelijen</li></ul><h3>AI dalam Militer</h3><p>Kecerdasan buatan digunakan untuk analisis data intelijen, sistem senjata otonom, dan pengambilan keputusan di medan perang secara real-time.</p>` },
  { kategori:"Sejarah", title:"Perang Dingin: Dua Kekuatan yang Mengancam Dunia", tanggal:"20 Mei 2024", desc:"Rivalitas Amerika Serikat dan Uni Soviet yang berlangsung puluhan tahun dan membentuk peta dunia modern.", isi:`<p>Perang Dingin (1947–1991) adalah persaingan geopolitik, ideologis, dan militer antara Amerika Serikat dan Uni Soviet yang berlangsung hampir setengah abad.</p><h3>Mengapa Disebut "Dingin"?</h3><p>Karena kedua kekuatan tidak pernah bertempur secara langsung, melainkan melalui negara-negara proksi, perlombaan senjata, dan persaingan teknologi.</p><h3>Peristiwa Kunci</h3><ul><li><strong>Blokade Berlin (1948)</strong> — Soviet memblokade Berlin Barat, AS merespons dengan jembatan udara.</li><li><strong>Krisis Rudal Kuba (1962)</strong> — Dunia hampir menuju perang nuklir.</li><li><strong>Perlombaan Luar Angkasa</strong> — Sputnik, Apollo 11, persaingan teknologi antariksa.</li></ul><h3>Akhir Perang Dingin</h3><p>Runtuhnya Tembok Berlin pada 1989 dan bubarnya Uni Soviet pada 1991 mengakhiri Perang Dingin dengan kemenangan blok Barat.</p>` },
  { kategori:"Perang", title:"Perang Saudara Spanyol", tanggal:"1 Jun 2024", desc:"Konflik brutal 1936–1939 yang membelah Spanyol menjadi dua kubu dan menjadi pemanasan Perang Dunia II.", isi:`<p>Perang Saudara Spanyol (1936–1939) adalah konflik antara pemerintah Republik Spanyol yang sah melawan pasukan nasionalis pimpinan Jenderal Francisco Franco.</p><h3>Latar Belakang</h3><p>Ketegangan politik antara kaum kiri dan kanan telah lama membara di Spanyol. Pada Juli 1936, Franco memimpin kudeta militer yang gagal, namun memicu perang saudara yang menghancurkan.</p><h3>Pihak yang Bertarung</h3><ul><li><strong>Republik</strong> — didukung Uni Soviet dan relawan internasional.</li><li><strong>Nasionalis</strong> — didukung Nazi Jerman dan Fasis Italia.</li></ul><h3>Pemboman Guernica</h3><p>Pada April 1937, Jerman mengebom kota Guernica sebagai "latihan" untuk Perang Dunia II.</p><h3>Akhir Perang</h3><p>Franco memenangkan perang pada April 1939 dan memerintah Spanyol sebagai diktator hingga kematiannya pada 1975.</p>` },
  { kategori:"Perang", title:"Perang Musim Dingin Finlandia", tanggal:"3 Jun 2024", desc:"Bagaimana Finlandia kecil berhasil menahan serangan Uni Soviet yang jauh lebih besar selama musim dingin 1939.", isi:`<p>Perang Musim Dingin (30 November 1939 – 13 Maret 1940) adalah konflik antara Uni Soviet dan Finlandia. Meski kalah secara jumlah, Finlandia memberikan perlawanan luar biasa.</p><h3>Kekuatan Kedua Pihak</h3><ul><li><strong>Soviet</strong> — 450.000 tentara, 6.000 tank, 3.800 pesawat</li><li><strong>Finlandia</strong> — 300.000 tentara, 30 tank, 130 pesawat</li></ul><h3>Taktik Finlandia</h3><p>Tentara Finlandia memanfaatkan hutan dan salju tebal untuk bertempur secara gerilya.</p><h3>Simo Häyhä — White Death</h3><p>Sniper legendaris Finlandia ini mencatat 500+ konfirmasi pembunuhan dalam 100 hari.</p>` },
  { kategori:"Senjata", title:"Tank Object 775", tanggal:"5 Jun 2024", desc:"Tank eksperimental Soviet dengan meriam roket unik yang tidak pernah diproduksi massal.", isi:`<p>Object 775 adalah tank eksperimental Soviet yang dikembangkan pada awal 1960-an dengan desain yang sangat unik dan revolusioner.</p><h3>Desain Unik</h3><p>Tank ini menggunakan meriam-peluncur roket kaliber 125mm yang bisa menembakkan rudal anti-tank berpemandu dari dalam lambung tank yang sangat rendah.</p><h3>Spesifikasi</h3><ul><li><strong>Berat</strong> — sekitar 36 ton</li><li><strong>Senjata utama</strong> — meriam roket 125mm</li><li><strong>Awak</strong> — hanya 2 orang</li></ul><h3>Mengapa Tidak Diproduksi?</h3><p>Meski inovatif, Object 775 memiliki masalah serius — jangkauan penglihatan awak sangat terbatas dan sistem senjatanya terlalu kompleks.</p>` },
  { kategori:"Senjata", title:"Tank Maus — Monster Baja Nazi", tanggal:"7 Jun 2024", desc:"Tank terberat yang pernah dibuat manusia, 188 ton baja Jerman yang tidak pernah bertempur di medan perang.", isi:`<p>Panzerkampfwagen VIII Maus adalah tank terberat yang pernah dibuat dalam sejarah. Dengan bobot 188 ton, tank raksasa ini adalah proyek ambisius Nazi Jerman.</p><h3>Spesifikasi Monster</h3><ul><li><strong>Berat</strong> — 188 ton</li><li><strong>Senjata utama</strong> — meriam 128mm + meriam 75mm</li><li><strong>Baju baja</strong> — hingga 240mm</li></ul><h3>Masalah Besar</h3><p>Maus terlalu berat untuk melewati jembatan manapun di Eropa. Tank ini harus menyeberangi sungai dengan cara menyelam di dasar sungai.</p><h3>Nasib Maus</h3><p>Hanya 2 unit yang berhasil dibuat. Satu unit kini ada di Museum Tank Kubinka, Rusia.</p>` },
  { kategori:"Sejarah", title:"Attack of the Dead Men", tanggal:"9 Jun 2024", desc:"100 tentara Rusia yang terkena gas klorin bangkit menyerang dan memukul mundur pasukan Jerman.", isi:`<p>"Serangan Orang Mati" terjadi pada 6 Agustus 1915 di Benteng Osowiec, Polandia — salah satu kisah paling luar biasa dalam sejarah Perang Dunia I.</p><h3>Serangan Gas Jerman</h3><p>Jerman melancarkan serangan gas klorin dalam skala besar. Sekitar 100 tentara Rusia yang tersisa terkena gas mematikan ini.</p><h3>Bangkit dari Kematian</h3><p>Tentara Rusia yang sudah sekarat, dengan paru-paru terbakar, bangkit dan melancarkan serangan balik dengan bayonet.</p><h3>Akibat bagi Jerman</h3><p>Pasukan Jerman yang melihat puluhan "zombie" berdarah menyerang mereka panik besar dan mundur.</p>` },
  { kategori:"Perang", title:"Perang Rif", tanggal:"11 Jun 2024", desc:"Perlawanan suku Berber Maroko melawan Spanyol dan Prancis 1921–1926.", isi:`<p>Perang Rif (1921–1926) adalah perlawanan suku Berber di pegunungan Rif, Maroko Utara, melawan penjajahan Spanyol dan kemudian Prancis, dipimpin oleh Abd el-Krim.</p><h3>Bencana Annual 1921</h3><p>Pada Juli 1921, pasukan Berber menghancurkan total 20.000 tentara Spanyol di Annual.</p><h3>Republik Rif</h3><p>Abd el-Krim mendirikan Republik Konfederasi Suku Rif — negara modern pertama di Afrika dengan konstitusi.</p><h3>Pengaruh Global</h3><p>Kemenangan awal Abd el-Krim menginspirasi gerakan kemerdekaan di Asia, Afrika, dan Timur Tengah.</p>` },
  { kategori:"Perang", title:"Perang Dunia I", tanggal:"13 Jun 2024", desc:"Konflik global 1914–1918 yang menghancurkan empat kekaisaran besar dan merenggut 20 juta jiwa.", isi:`<p>Perang Dunia I (1914–1918) adalah konflik global yang menghancurkan empat kekaisaran besar — Ottoman, Austro-Hungaria, Jerman, dan Rusia.</p><h3>Pemicu Perang</h3><p>Pembunuhan Archduke Franz Ferdinand di Sarajevo pada 28 Juni 1914 memicu serangkaian aliansi yang menyeret seluruh Eropa ke dalam perang.</p><h3>Perang Parit</h3><p>PD I didominasi perang parit di Front Barat. Jutaan tentara hidup dalam parit berlumpur.</p><h3>Pertempuran Paling Berdarah</h3><ul><li><strong>Pertempuran Somme</strong> — 1 juta korban</li><li><strong>Pertempuran Verdun</strong> — 700.000 korban</li></ul>` },
  { kategori:"Militer", title:"Divisi SS Handschar", tanggal:"15 Jun 2024", desc:"Divisi Waffen-SS unik yang terdiri dari Muslim Bosnia bertempur untuk Nazi Jerman di Balkan.", isi:`<p>Divisi SS ke-13 "Handschar" adalah divisi Waffen-SS yang unik karena sebagian besar anggotanya adalah Muslim Bosnia.</p><h3>Pembentukan</h3><p>Heinrich Himmler membentuk divisi ini setelah melihat potensi rekrutmen di Bosnia, dengan dukungan Grand Mufti Yerusalem Amin al-Husseini.</p><h3>Keunikan Divisi</h3><ul><li>Diizinkan membawa imam di setiap batalion</li><li>Mendapat makanan halal</li><li>Seragam khusus dengan peci fez</li></ul><h3>Kejahatan Perang</h3><p>Divisi ini terlibat dalam pembantaian warga sipil Serbia dan Yahudi di Bosnia.</p>` },
  { kategori:"Senjata", title:"Panzerfaust — Senjata Anti-Tank Jerman", tanggal:"17 Jun 2024", desc:"Senjata anti-tank sekali pakai yang murah dan mematikan, mimpi buruk pasukan lapis baja Sekutu.", isi:`<p>Panzerfaust (bahasa Jerman: "tinju baja") adalah senjata anti-tank sekali pakai yang dikembangkan Jerman pada Perang Dunia II.</p><h3>Desain Revolusioner</h3><p>Panzerfaust terdiri dari tabung baja sederhana berisi hulu ledak berbentuk kerucut.</p><h3>Varian Utama</h3><ul><li><strong>Panzerfaust 30</strong> — jangkauan 30 meter</li><li><strong>Panzerfaust 60</strong> — jangkauan 60 meter</li><li><strong>Panzerfaust 100</strong> — jangkauan 100 meter</li></ul><h3>Warisan</h3><p>Konsep Panzerfaust menginspirasi pengembangan RPG-7 Soviet.</p>` },

  // --- 30 ARTIKEL BARU ---
  { kategori:"Perang", title:"Perang Napoleon: Ambisi Mengguncang Eropa", tanggal:"1 Jan 2024", desc:"Serangkaian konflik besar yang melibatkan Napoleon Bonaparte melawan koalisi kekuatan Eropa.", isi:`<p>Perang Napoleon (1803–1815) mengubah wajah Eropa secara drastis. Napoleon berhasil menguasai sebagian besar Eropa Barat melalui taktik militer inovatif.</p><h3>Invasi ke Rusia</h3><p>Pada 1812, invasi besar-besaran ke Rusia gagal total akibat musim dingin ekstrem dan taktik bumi hangus.</p><h3>Waterloo</h3><p>Napoleon akhirnya dikalahkan secara telak di Pertempuran Waterloo pada 1815.</p>` },
  { kategori:"Sejarah", title:"Revolusi Prancis: Runtuhnya Feodalisme", tanggal:"15 Jan 2024", desc:"Periode perubahan sosial radikal yang menggulingkan monarki absolut Prancis.", isi:`<p>Revolusi Prancis (1789–1799) mengakhiri monarki absolut. Rakyat bangkit melawan ketidaksetaraan sosial dan krisis keuangan.</p><h3>Era Teror</h3><p>Di bawah Robespierre, ribuan orang dieksekusi dengan guillotine.</p><h3>Warisan</h3><p>Menyebarkan ide demokrasi dan sekularisme ke seluruh Eropa.</p>` },
  { kategori:"Militer", title:"Pertempuran Thermopylae: 300 Spartan", tanggal:"20 Jan 2024", desc:"Kisah legendaris Raja Leonidas memimpin pasukan kecil melawan invasi Kekaisaran Persia.", isi:`<p>Pertempuran Thermopylae (480 SM) adalah simbol keberanian melawan tirani.</p><h3>Strategi Yunani</h3><p>Memanfaatkan celah sempit pegunungan untuk menetralisir jumlah pasukan Persia yang besar.</p><h3>Pengorbanan</h3><p>Leonidas dan 300 Spartan bertarung sampai mati memberi waktu pasukan lain mundur.</p>` },
  { kategori:"Perang", title:"Perang Salib: Perebutan Tanah Suci", tanggal:"2 Feb 2024", desc:"Ekspedisi militer umat Kristen Eropa untuk merebut Yerusalem dari kekuasaan Muslim.", isi:`<p>Perang Salib berlangsung dari abad ke-11 hingga ke-13.</p><h3>Salahuddin Al-Ayyubi</h3><p>Pada 1187, Salahuddin memenangkan Pertempuran Hattin dan merebut kembali Yerusalem.</p><h3>Dampak</h3><p>Membuka jalur perdagangan dan pertukaran budaya antara Timur dan Barat.</p>` },
  { kategori:"Sejarah", title:"Revolusi Rusia 1917: Lahirnya Uni Soviet", tanggal:"10 Feb 2024", desc:"Penggulingan monarki Tsar yang melahirkan negara komunis pertama di dunia.", isi:`<p>Revolusi Rusia menggulingkan Tsar Nicholas II dan membawa Bolshevik berkuasa.</p><h3>Revolusi Oktober</h3><p>Vladimir Lenin mengambil alih kekuasaan dan menjanjikan "Damai, Roti, dan Tanah".</p><h3>Dampak Global</h3><p>Memulai Perang Dingin dan menyebarkan ideologi komunis ke seluruh dunia.</p>` },
  { kategori:"Perang", title:"Pengeboman Pearl Harbor: Bangkitnya AS", tanggal:"12 Feb 2024", desc:"Serangan mendadak Jepang yang menyeret Amerika Serikat ke dalam Perang Dunia II.", isi:`<p>Pada 7 Desember 1941, Angkatan Laut Jepang menyerang pangkalan AS di Hawaii.</p><h3>Deklarasi Perang</h3><p>Presiden Roosevelt menyebutnya "tanggal yang akan hidup dalam keburukan" dan AS menyatakan perang.</p><h3>Konsekuensi</h3><p>Mengubah keseimbangan kekuatan dunia dan mempercepat berakhirnya PD II.</p>` },
  { kategori:"Perang", title:"Pertempuran Stalingrad: Titik Balik PD II", tanggal:"15 Feb 2024", desc:"Pertempuran paling berdarah yang mematahkan mitos tak terkalahkan Nazi Jerman.", isi:`<p>Pertempuran Stalingrad (1942–1943) adalah perang kota brutal antara Jerman dan Soviet.</p><h3>Operasi Uranus</h3><p>Soviet mengepung Tentara Keenam Jerman di tengah musim dingin ekstrem.</p><h3>Akhir Pertempuran</h3><p>Jenderal Paulus menyerah pada 2 Februari 1943, menjadi kekalahan pertama yang diakui Nazi.</p>` },
  { kategori:"Sejarah", title:"Pendaratan Normandia (D-Day)", tanggal:"20 Feb 2024", desc:"Pendaratan amfibi terbesar dalam sejarah yang menjadi awal pembebasan Eropa Barat.", isi:`<p>D-Day terjadi pada 6 Juni 1944
    { kategori:"Sejarah", title:"Pendaratan Normandia (D-Day)", tanggal:"20 Feb 2024", desc:"Pendaratan amfibi terbesar dalam sejarah yang menjadi awal pembebasan Eropa Barat.", isi:`<p>D-Day terjadi pada 6 Juni 1944 di pantai Normandia, Prancis.</p><h3>Persiapan Sekutu</h3><p>Dipimpin Jenderal Eisenhower, Sekutu mengumpulkan 150.000 tentara dan 5.000 kapal.</p><h3>Pantai Pendaratan</h3><p>Terbagi menjadi lima pantai: Utah, Omaha, Gold, Juno, dan Sword.</p><h3>Pembebasan Eropa</h3><p>Menjadi awal pembebasan Eropa Barat dari pendudukan Nazi.</p>` },
  { kategori:"Senjata", title:"Bom Atom Hiroshima dan Nagasaki", tanggal:"25 Feb 2024", desc:"Satu-satunya penggunaan senjata nuklir dalam perang di sejarah manusia.", isi:`<p>Pada Agustus 1945, AS menjatuhkan bom atom di Hiroshima dan Nagasaki.</p><h3>Proyek Manhattan</h3><p>Proyek rahasia AS yang dipimpin fisikawan J. Robert Oppenheimer.</p><h3>Korban</h3><p>Sekitar 100.000 hingga 200.000 orang tewas akibat luka bakar dan radiasi.</p><h3>Menyerahnya Jepang</h3><p>Pada 15 Agustus 1945, Kaisar Hirohito mengumumkan penyerahan Jepang.</p>` },
  { kategori:"Perang", title:"Perang Korea: Konflik Tak Berakhir", tanggal:"1 Mar 2024", desc:"Perang proksi Perang Dingin antara Korea Utara (komunis) dan Korea Selatan (kapitalis).", isi:`<p>Perang Korea (1950–1953) melibatkan PBB dan AS di pihak Selatan, serta China dan Soviet di pihak Utara.</p><h3>Pecahnya Konflik</h3><p>Korea Utara menginvasi Selatan melewati garis paralel ke-38.</p><h3>Gencatan Senjata</h3><p>Berakhir pada 27 Juli 1953 di Panmunjom, namun secara resmi masih berperang.</p>` },
  { kategori:"Perang", title:"Perang Vietnam: Neraka di Hutan", tanggal:"5 Mar 2024", desc:"Konflik panjang dan berdarah yang melibatkan taktik gerilya Viet Cong melawan AS.", isi:`<p>Perang Vietnam (1955–1975) terjadi antara Vietnam Utara (komunis) dan Vietnam Selatan (didukung AS).</p><h3>Teori Domino</h3><p>AS khawatir jika Vietnam jatuh ke komunis, Asia Tenggara akan mengikuti.</p><h3>Taktik Gerilya</h3><p>Viet Cong menggunakan hutan rimba untuk menyergap pasukan AS.</p><h3>Penarikan Pasukan</h3><p>AS mundur pada 1973, dan Saigon jatuh pada 1975.</p>` },
  { kategori:"Sejarah", title:"Reformasi Protestan: Guncangan Gereja", tanggal:"10 Mar 2024", desc:"Gerakan Martin Luther yang menantang otoritas Gereja Katolik Roma pada abad ke-16.", isi:`<p>Reformasi Protestan memicu perpecahan besar dalam agama Kristen.</p><h3>Martin Luther</h3><p>Memprotes penjualan indulgensi dengan memakukan 95 Tesis pada 1517.</p><h3>Kontra-Reformasi</h3><p>Gereja Katolik merespons dengan Konsili Trent.</p>` },
  { kategori:"Militer", title:"Genghis Khan dan Kekaisaran Mongol", tanggal:"15 Mar 2024", desc:"Pendiri kekaisaran darat terbesar dalam sejarah yang membentang dari Asia hingga Eropa.", isi:`<p>Genghis Khan menyatukan suku-suku Mongol dan memproklamirkan diri sebagai Khan Agung pada 1206.</p><h3>Taktik Perang</h3><p>Kavaleri pemanah bergerak cepat dan taktik psikologis yang mengerikan.</p><h3>Jalur Sutra</h3><p>Pemerintahan Mongol menciptakan stabilitas yang memungkinkan perdagangan berkembang.</p>` },
  { kategori:"Sejarah", title:"Penemuan Benua Amerika oleh Columbus", tanggal:"20 Mar 2024", desc:"Pelayaran Columbus pada 1492 yang membuka pintu kolonialisme Eropa di Amerika.", isi:`<p>Christopher Columbus berlayar mencari jalur ke Asia namun menemukan benua baru.</p><h3>Pendaratan Pertama</h3><p>Mendarat di pulau San Salvador (Bahama) dan menjelajahi Kuba.</p><h3>Pertukaran Columbian</h3><p>Pertukaran tanaman, hewan, dan penyakit yang mengubah demografi dunia.</p>` },
  { kategori:"Militer", title:"Pasukan Spartacus: Pemberontakan Gladiator", tanggal:"25 Mar 2024", desc:"Pemberontakan budak terbesar melawan Republik Romawi yang dipimpin seorang gladiator.", isi:`<p>Pada 73 SM, Spartacus memimpin pemberontakan budak melawan Roma.</p><h3>Kemenangan Awal</h3><p>Mengalahkan beberapa legiun Romawi dan mengumpulkan puluhan ribu pasukan.</p><h3>Pemberontakan Berakhir</h3><p>Dikalahkan Jenderal Crassus, namun menjadi simbol abadi perlawanan.</p>` },
  { kategori:"Perang", title:"Perang Tiga Puluh Tahun", tanggal:"1 Apr 2024", desc:"Perang besar Eropa yang awalnya dipicu konflik agama Katolik dan Protestan.", isi:`<p>Perang Tiga Puluh Tahun (1618–1648) melibatkan hampir semua negara Eropa.</p><h3>Kehancuran Eropa</h3><p>Populasi Jerman turun drastis akibat kelaparan dan penyakit.</p><h3>Perdamaian Westfalen</h3><p>Mengakhiri perang dan menjadi dasar sistem negara modern.</p>` },
  { kategori:"Sejarah", title:"Peradaban Mesir Kuno dan Piramida", tanggal:"5 Apr 2024", desc:"Salah satu peradaban tertua dengan peninggalan arsitektur luar biasa seperti Piramida Giza.", isi:`<p>Mesir Kuno berkembang di sepanjang Sungai Nil.</p><h3>Piramida Giza</h3><p>Dibangun sebagai makam Firaun, menjadi salah satu keajaiban dunia kuno.</p><h3>Hieroglif</h3><p>Sistem tulisan gambar yang menjadi kunci pemahaman sejarah Mesir.</p>` },
  { kategori:"Sejarah", title:"Kekaisaran Romawi: Kejayaan dan Keruntuhan", tanggal:"10 Apr 2024", desc:"Dari Republik menjadi Kekaisaran besar yang menguasai Eropa, Afrika Utara, dan Timur Tengah.", isi:`<p>Kekaisaran Romawi adalah salah satu kekaisaran terbesar dan paling berpengaruh.</p><h3>Julius Caesar</h3><p>Perannya mengubah Republik menjadi Kekaisaran.</p><h3>Keruntuhan</h3><p>Runtuh pada 476 M akibat invasi barbar dan krisis internal.</p>` },
  { kategori:"Perang", title:"Perang Troya: Mitos atau Nyata?", tanggal:"15 Apr 2024", desc:"Konflik legendaris antara Yunani dan Troya yang diabadikan dalam Iliad.", isi:`<p>Perang Troya menjadi salah satu kisah epik paling terkenal.</p><h3>Kuda Troya</h3><p>Strategi licik Yunani menyusup ke dalam kota.</p><h3>Penemuan Arkeologi</h3><p>Reruntuhan Troya ditemukan di Turki modern.</p>` },
  { kategori:"Militer", title:"Alexander Agung: Penakluk Dunia", tanggal:"20 Apr 2024", desc:"Raja Makedonia yang menaklukkan Kekaisaran Persia hingga India.", isi:`<p>Alexander Agung (356–323 SM) menciptakan salah satu kekaisaran terbesar.</p><h3>Penaklukan Persia</h3><p>Mengalahkan Darius III dan menguasai Timur Tengah.</p><h3>Warisan</h3><p>Menyebarkan budaya Yunani (Hellenisme) ke seluruh wilayah taklukannya.</p>` },
  { kategori:"Sejarah", title:"Peradaban Lembah Indus", tanggal:"25 Apr 2024", desc:"Peradaban maju kuno di Asia Selatan dengan sistem drainase dan kota terencana.", isi:`<p>Peradaban Lembah Indus (3300–1300 SM) adalah salah satu peradaban tertua.</p><h3>Kota Terencana</h3><p>Mohenjo-daro dan Harappa memiliki sistem sanitasi canggih.</p><h3>Misteri</h3><p>Bahasa dan penyebab kemundurannya masih menjadi misteri.</p>` },
  { kategori:"Militer", title:"Pasukan Janissari: Pengawal Elit Ottoman", tanggal:"1 Mei 2024", desc:"Pasukan infanteri elit Kekaisaran Ottoman yang dilatih sejak muda.", isi:`<p>Janissari adalah pasukan elit yang menjadi tulang punggung militer Ottoman.</p><h3>Sistem Devshirme</h3><p>Anak-anak Kristen diambil dan dididik menjadi tentara Islam.</p><h3>Kemunduran</h3><p>Kekuasaan mereka yang terlalu besar akhirnya dibubarkan pada 1826.</p>` },
  { kategori:"Perang", title:"Perang Seratus Tahun", tanggal:"5 Mei 2024", desc:"Konflik berkepanjangan antara Inggris dan Prancis pada abad pertengahan.", isi:`<p>Perang Seratus Tahun (1337–1453) adalah serangkaian konflik antara Inggris dan Prancis.</p><h3>Joan of Arc</h3><p>Pahlawan wanita Prancis yang memimpin pasukan melawan Inggris.</p><h3>Dampak</h3><p>Mengakhiri feodalisme dan membentuk identitas nasional.</p>` },
  { kategori:"Sejarah", title:"Revolusi Industri: Awal Dunia Modern", tanggal:"10 Mei 2024", desc:"Pergeseran besar dari tenaga manusia ke mesin yang mengubah ekonomi dunia.", isi:`<p>Revolusi Industri dimulai di Inggris pada abad ke-18.</p><h3>Mesin Uap</h3><p>Penemuan James Watt mengubah manufaktur dan transportasi.</p><h3>Dampak Sosial</h3><p>Munculnya kelas pekerja dan urbanisasi besar-besaran.</p>` },
  { kategori:"Perang", title:"Perang Candu: Inggris vs Tiongkok", tanggal:"15 Mei 2024", desc:"Konflik yang membuka pintu Tiongkok bagi kekuatan imperialis Barat.", isi:`<p>Perang Candu (1839–1842) dipicu oleh upaya Tiongkok menghentikan perdagangan opium Inggris.</p><h3>Perjanjian Nanjing</h3><p>Tiongkok menyerahkan Hong Kong kepada Inggris.</p><h3>Dampak</h3><p>Awal dari "Abad Penghinaan" bagi Tiongkok.</p>` },
  { kategori:"Militer", title:"Pasukan Gurkha: Tentara Legendaris Nepal", tanggal:"20 Mei 2024", desc:"Pasukan pemberani dari Nepal yang bertempur untuk Inggris dan India.", isi:`<p>Gurkha dikenal karena keberanian dan kemampuan tempur mereka.</p><h3>Kukri</h3><p>Pisau lengkung khas mereka yang menjadi senjata ikonik.</p><h3>Pengabdian</h3><p>Bertempur di berbagai perang dunia atas nama Kerajaan Inggris.</p>` },
  { kategori:"Sejarah", title:"Peradaban Maya: Astronomi dan Matematika", tanggal:"25 Mei 2024", desc:"Peradaban Amerika Tengah yang menguasai astronomi dan memiliki sistem tulisan sendiri.", isi:`<p>Maya berkembang di Meksiko selatan dan Amerika Tengah.</p><h3>Kalender Maya</h3><p>Sangat akurat dalam menghitung peredaran matahari dan Venus.</p><h3>Angka Nol</h3><p>Salah satu peradaban pertama yang menggunakan konsep angka nol.</p>` },
  { kategori:"Perang", title:"Perang Boer: Perlawanan Afrika Selatan", tanggal:"30 Mei 2024", desc:"Perang antara Inggris melawan koloni Boer (Belanda) di Afrika Selatan.", isi:`<p>Perang Boer (1899–1902) adalah konflik atas kendali tambang emas.</p><h3>Perang Gerilya</h3><p>Boer menggunakan taktik gerilya yang membuat Inggris frustrasi.</p><h3>Kamp Konsentrasi</h3><p>Inggris menempatkan warga sipil di kamp yang memakan banyak korban.</p>` },
  { kategori:"Militer", title:"Pasukan Terakota: Pasukan Bawah Tanah", tanggal:"5 Jun 2024", desc:"Pasukan tentara dari Dinasti Qin yang menjadi penemuan arkeologi spektakuler.", isi:`<p>Lebih dari 8.000 patung tentara ditemukan di dekat makam Kaisar Qin Shi Huang.</p><h3>Penemuan</h3><p>Ditemukan secara tidak sengaja oleh petani pada tahun 1974.</p><h3>Detail</h3><p>Setiap wajah patung memiliki ekspresi dan bentuk yang berbeda.</p>` },
  { kategori:"Sejarah", title:"Perpustakaan Alexandria: Pusat Ilmu Dunia", tanggal:"10 Jun 2024", desc:"Perpustakaan terbesar di dunia kuno yang menyimpan ribuan pengetahuan.", isi:`<p>Perpustakaan ini berada di kota Alexandria, Mesir, pada masa Yunani kuno.</p><h3>Pengetahuan</h3><p>Menyimpan manuskrip dari seluruh dunia kuno.</p><h3>Kehancuran</h3><p>Hilang secara misterius akibat kebakaran atau invasi.</p>` },
  { kategori:"Perang", title:"Perang Candu II: Dominasi Barat", tanggal:"15 Jun 2024", desc:"Lanjutan konflik yang memaksa Tiongkok membuka lebih banyak pelabuhan.", isi:`<p>Perang Candu Kedua (1856–1860) melibatkan Inggris dan Prancis melawan Tiongkok.</p><h3>Istana Musim Panas</h3><p>Istana kerajaan dihancurkan oleh pasukan Barat.</p><h3>Konsekuensi</h3><p>Membuka Tiongkok lebih luas bagi pengaruh asing.</p>` },
  { kategori:"Militer", title:"Legiun Romawi: Kekuatan Terbesar Zaman Kuno", tanggal:"20 Jun 2024", desc:"Pasukan militer Republik dan Kekaisaran Romawi yang sangat disiplin.", isi:`<p>Legiun adalah inti kekuatan militer Romawi.</p><h3>Disiplin</h3><p>Latihan keras dan struktur organisasi yang ketat.</p><h3>Taktik</h3><p>Formasi perisai (testudo) yang membuat mereka nyaris tak terkalahkan.</p>` },
  { kategori:"Sejarah", title:"Zaman Kegelapan (Dark Ages) di Eropa", tanggal:"25 Jun 2024", desc:"Periode setelah runtuhnya Romawi yang ditandai dengan kemunduran peradaban.", isi:`<p>Zaman Kegelapan terjadi sekitar abad ke-5 hingga ke-10 Masehi.</p><h3>Feodalisme</h3><p>Sistem sosial di mana bangsawan melindungi petani.</p><h3>Gereja</h3><p>Satu-satunya institusi yang bertahan kuat di masa itu.</p>` },
  { kategori:"Perang", title:"Perang Delapan Puluh Tahun: Kemerdekaan Belanda", tanggal:"30 Jun 2024", desc:"Perang kemerdekaan Belanda melawan kekuasaan Spanyol.", isi:`<p>Perang berlangsung dari 1568 hingga 1648.</p><h3>Perlawanan</h3><p>Belanda bangkit melawan penindasan agama Katolik Spanyol.</p><h3>Kemerdekaan</h3><p>Berakhir dengan diakuinya Republik Belanda.</p>` },
  { kategori:"Militer", title:"Kamikaze: Pilot Bunuh Diri Jepang", tanggal:"5 Jul 2024", desc:"Serangan udara bunuh diri oleh Kekaisaran Jepang pada akhir PD II.", isi:`<p>Kamikaze berarti "Angin Ilahi".</p><h3>Taktik</h3><p>Pilot menabrakkan pesawat berisi bahan peledak ke kapal Sekutu.</p><h3>Dampak</h3><p>Menimbulkan ketakutan, namun tidak mengubah hasil perang.</p>` },
  { kategori:"Sejarah", title:"Runtuhnya Tembok Berlin", tanggal:"10 Jul 2024", desc:"Simbol runtuhnya komunisme dan berakhirnya Perang Dingin.", isi:`<p>Tembok Berlin runtuh pada 9 November 1989.</p><h3>Pemisahan</h3><p>Dibangun pada 1961 untuk memisahkan Jerman Timur dan Barat.</p><h3>Penyatuan</h3><p>Runtuhnya tembok memicu reunifikasi Jerman.</p>` },
  { kategori:"Perang", title:"Perang Yom Kippur", tanggal:"15 Jul 2024", desc:"Konflik antara Israel melawan koalisi Mesir dan Suriah pada tahun 1973.", isi:`<p>Perang dimulai saat hari suci Yom Kippur.</p><h3>Serangan Kejutan</h3><p>Mesir menyeberangi Terusan Suez dan menyerang Israel.</p><h3>Hasil</h3><p>Meski Israel bertahan, ini memicu perundingan damai.</p>` },
  { kategori:"Militer", title:"Pasukan Navy SEAL: Elit Angkatan Laut AS", tanggal:"20 Jul 2024", desc:"Pasukan operasi khusus paling tangguh di dunia.", isi:`<p>Navy SEAL adalah pasukan khusus Angkatan Laut Amerika Serikat.</p><h3>Pelatihan</h3><p>Salah satu pelatihan militer terberat di dunia.</p><h3>Operasi</h3><p>Terkenal dengan operasi penangkapan Osama bin Laden.</p>` },
  { kategori:"Sejarah", title:"Peradaban Inca: Kerajaan di Pegunungan Andes", tanggal:"25 Jul 2024", desc:"Kekaisaran besar di Amerika Selatan dengan arsitektur batu yang luar biasa.", isi:`<p>Inca menguasai wilayah pegunungan Andes.</p><h3>Machu Picchu</h3><p>Kota bersejarah yang menjadi keajaiban arsitektur.</p><h3>Jalan Raya</h3><p>Membangun jaringan jalan luas di medan yang sulit.</p>` },
  { kategori:"Perang", title:"Perang India-Pakistan 1947", tanggal:"30 Jul 2024", desc:"Konflik pertama antara India dan Pakistan setelah pemisahan.", isi:`<p>Perang terjadi atas sengketa wilayah Kashmir.</p><h3>Garis Kontrol</h3><p>Gencatan senjata membentuk garis pemisah hingga kini.</p><h3>Dampak</h3><p>Ketegangan berkepanjangan di Asia Selatan.</p>` },
  { kategori:"Militer", title:"Tank T-34: Senjata Rahasia Soviet", tanggal:"5 Agu 2024", desc:"Tank Soviet yang revolusioner dan menjadi tulang punggung kemenangan PD II.", isi:`<p>T-34 memiliki desain lambung miring dan meriam besar.</p><h3>Produksi Massal</h3><p>Soviet memproduksi puluhan ribu unit dengan cepat.</p><h3>Kemampuan</h3><p>Sangat handal di medan perang dan lumpur Rusia.</p>` }
];

// ================================================================
// FUNGSI RENDER & MODAL
// ================================================================
const grid = document.getElementById('artikelGrid');
const emojiMap = { "Perang":"⚔️", "Sejarah":"📜", "Militer":"🎖️", "Senjata":"🔫" };

artikelData.forEach((art, index) => {
  const emoji = emojiMap[art.kategori] || "📖";
  grid.innerHTML += `
    <div class="artikel-card reveal" data-kategori="${art.kategori.toLowerCase()}" onclick="bukaArtikel(${index})">
      <div class="artikel-thumb">${emoji}</div>
      <div class="artikel-body">
        <div class="artikel-meta">
          <span class="artikel-kategori">${art.kategori}</span>
          <span class="artikel-tanggal">${art.tanggal}</span>
        </div>
        <h3 class="artikel-title">${art.title}</h3>
        <p class="artikel-desc">${art.desc}</p>
        <a class="artikel-link">Baca Selengkapnya →</a>
      </div>
    </div>
  `;
});

function bukaArtikel(index) {
  const a = artikelData[index];
  document.getElementById('modalKategori').textContent = a.kategori;
  document.getElementById('modalTitle').textContent = a.title;
  document.getElementById('modalDate').textContent = a.tanggal;
  document.getElementById('modalBody').innerHTML = a.isi;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function tutupArtikel(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || (e.target && e.target.classList.contains('modal-close'))) {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
}

function filterArtikel(kat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.artikel-card').forEach(card => {
    card.style.display = (kat === 'semua' || card.dataset.kategori === kat) ? '' : 'none';
  });
}

document.addEventListener('keydown', e => { if(e.key==='Escape') tutupArtikel({}); });

const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
