<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔒 Admin Blog — Azzam</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0C0C0E;--surface:#141416;--border:#222226;--accent:#6EE7B7;--text:#E4E4E7;--muted:#71717A;--danger:#f87171}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;line-height:1.7;min-height:100vh}

/* LAYAR LOGIN */
#loginScreen{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#0C0C0E,#141420);display:flex;align-items:center;justify-content:center;padding:1.5rem}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;max-width:400px;width:100%;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,0.6)}
.login-card h2{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:0.5rem}
.login-card p{color:var(--muted);font-size:0.85rem;margin-bottom:1.5rem}
.input-pass{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:0.9rem;color:var(--text);font-family:inherit;font-size:1rem;text-align:center;margin-bottom:1rem;letter-spacing:0.2em;outline:none}
.input-pass:focus{border-color:var(--accent)}
.btn-login{width:100%;padding:1rem;background:var(--accent);color:#0C0C0E;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;cursor:pointer}
.btn-login:hover{background:#a7f3d0}

/* HALAMAN ADMIN */
#adminPanel{display:none;padding:2rem 1rem}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;margin-bottom:2rem}
.header h1{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800}
.header a{color:var(--accent);text-decoration:none;font-size:0.9rem}
.box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem}
.box h2{font-family:'Syne',sans-serif;font-size:1.1rem;margin-bottom:1rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:0.75rem;color:var(--muted);margin-bottom:0.4rem;font-weight:600}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.8rem;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none}
.form-group textarea{min-height:150px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn{padding:0.8rem 1.5rem;border-radius:8px;font-weight:700;font-family:'Syne',sans-serif;font-size:0.9rem;cursor:pointer;border:none}
.btn-green{background:var(--accent);color:#0C0C0E}
.btn-red{background:rgba(248,113,113,0.15);border:1px solid var(--danger);color:var(--danger)}
.btn-gray{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-full{width:100%;margin-top:1rem}
.item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:0.8rem}
.item h3{font-size:1rem;margin-bottom:0.3rem}
.item p{font-size:0.75rem;color:var(--muted);margin-bottom:0.8rem}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:#0C0C0E;padding:0.8rem 1.5rem;border-radius:10px;font-weight:600;transition:transform 0.3s;z-index:999;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:var(--danger);color:#fff}
</style>
</head>
<body>

<!-- LAYAR LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div style="font-size:3rem;margin-bottom:1rem;">🔒</div>
    <h2>Admin Login</h2>
    <p>Masukkan password untuk mengelola blog.</p>
    <input type="password" id="passwordInput" class="input-pass" placeholder="••••••" />
    <button id="btnLogin" class="btn-login">🔓 Buka Admin</button>
  </div>
</div>

<!-- PANEL ADMIN -->
<div id="adminPanel">
  <div class="container">
    <div class="header">
      <h1>✏️ Admin Blog</h1>
      <p><a href="index.html">← Portfolio</a> | <a href="blog.html">Lihat Blog →</a></p>
    </div>

    <div class="box">
      <h2>📝 <span id="formTitle">Tulis Artikel Baru</span></h2>
      <input type="hidden" id="editId" />
      <div class="form-group">
        <label>Judul Artikel</label>
        <input type="text" id="judul" placeholder="Judul artikel..." />
      </div>
      <div class="row">
        <div class="form-group">
          <label>Kategori</label>
          <select id="kategori">
            <option value="Umum">Umum</option>
            <option value="Sejarah">Sejarah</option>
            <option value="Militer">Militer</option>
            <option value="Coding">Coding</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tanggal</label>
          <input type="date" id="tanggal" />
        </div>
      </div>
      <div class="form-group">
        <label>Ringkasan (Excerpt)</label>
        <textarea id="excerpt" style="min-height:60px;" placeholder="Ringkasan..."></textarea>
      </div>
      <div class="form-group">
        <label>Isi Artikel (HTML)</label>
        <textarea id="konten" placeholder="&lt;p&gt;Isi artikel...&lt;/p&gt;"></textarea>
      </div>
      <button id="btnSave" class="btn btn-green">💾 Simpan Artikel</button>
      <button id="btnClear" class="btn btn-gray">🧹 Bersihkan</button>
    </div>

    <div class="box">
      <h2>📚 Daftar Artikel (<span id="count">0</span>)</h2>
      <div id="list"></div>
      <button id="btnGenerate" class="btn btn-green btn-full">📋 Copy Kode untuk blog.html</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================================================================
// 1. SETTING PASSWORD DI SINI
// ================================================================
const PASSWORD = "admin123";

// 2. DATA AWAL
let daftarArtikel = [
  {
    id: "welcome",
    judul: "Selamat Datang!",
    kategori: "Umum",
    tanggal: "2024-12-01",
    excerpt: "Artikel pertama.",
    konten: "<p>Halo dunia!</p>"
  }
];

// 3. FUNGSI NOTIFIKASI
function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (error ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// 4. LOGIKA LOGIN
document.getElementById('btnLogin').addEventListener('click', function() {
  const input = document.getElementById('passwordInput').value;
  
  if (input === PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    renderList();
    setTanggal();
  } else {
    document.getElementById('passwordInput').value = '';
    showToast('❌ Password salah!', true);
  }
});

// Enter buat login
document.getElementById('passwordInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('btnLogin').click();
});

// 5. TANGGAL
function setTanggal() {
  const d = new Date();
  const iso = d.toISOString().split('T')[0];
  document.getElementById('tanggal').value = iso;
}

// 6. RENDER LIST
function renderList() {
  document.getElementById('count').textContent = daftarArtikel.length;
  const list = document.getElementById('list');
  
  if (daftarArtikel.length === 0) {
    list.innerHTML = '<p style="color:var(--muted);">Belum ada artikel.</p>';
    return;
  }

  list.innerHTML = daftarArtikel.map(a => `
    <div class="item">
      <h3>${a.judul}</h3>
      <p>📁 ${a.kategori} · 📅 ${a.tanggal}</p>
      <button class="btn btn-gray" onclick="editArtikel('${a.id}')">✏️ Edit</button>
      <button class="btn btn-red" onclick="hapusArtikel('${a.id}')">🗑️ Hapus</button>
    </div>
  `).join('');
}

// 7. SIMPAN
document.getElementById('btnSave').addEventListener('click', function() {
  const id = document.getElementById('editId').value;
  const judul = document.getElementById('judul').value.trim();
  const kategori = document.getElementById('kategori').value;
  const tanggal = document.getElementById('tanggal').value;
  const excerpt = document.getElementById('excerpt').value.trim();
  const konten = document.getElementById('konten').value.trim();

  if (!judul || !konten) {
    showToast('⚠️ Judul dan isi tidak boleh kosong!', true);
    return;
  }

  if (id) {
    // Update
    const idx = daftarArtikel.findIndex(a => a.id === id);
    if (idx !== -1) {
      daftarArtikel[idx] = { id, judul, kategori, tanggal, excerpt, konten };
      showToast('✅ Artikel diperbarui!');
    }
  } else {
    // Create
    daftarArtikel.unshift({ id: 'post_' + Date.now(), judul, kategori, tanggal, excerpt, konten });
    showToast('✅ Artikel ditambahkan!');
  }

  clearForm();
  renderList();
});

// 8. EDIT
function editArtikel(id) {
  const a = daftarArtikel.find(x => x.id === id);
  if (!a) return;

  document.getElementById('editId').value = a.id;
  document.getElementById('judul').value = a.judul;
  document.getElementById('kategori').value = a.kategori;
  document.getElementById('tanggal').value = a.tanggal;
  document.getElementById('excerpt').value = a.excerpt;
  document.getElementById('konten').value = a.konten;
  
  document.getElementById('formTitle').textContent = 'Edit Artikel';
  window.scrollTo(0, 0);
}

// 9. HAPUS
function hapusArtikel(id) {
  if (!confirm('Yakin hapus artikel ini?')) return;
  daftarArtikel = daftarArtikel.filter(a => a.id !== id);
  renderList();
  showToast('🗑️ Artikel dihapus!');
}

// 10. CLEAR
document.getElementById('btnClear').addEventListener('click', clearForm);

function clearForm() {
  document.getElementById('editId').value = '';
  document.getElementById('judul').value = '';
  document.getElementById('excerpt').value = '';
  document.getElementById('konten').value = '';
  document.getElementById('formTitle').textContent = 'Tulis Artikel Baru';
  setTanggal();
}

// 11. GENERATE KODE
document.getElementById('btnGenerate').addEventListener('click', function() {
  const kode = "const daftarArtikel = " + JSON.stringify(daftarArtikel, null, 2) + ";";
  
  navigator.clipboard.writeText(kode).then(() => {
    alert("✅ KODE BERHASIL DI-COPY!\n\nBuka file blog.html, cari 'const daftarArtikel = [...]', lalu paste kode ini.");
  }).catch(() => {
    prompt("Copy kode ini secara manual:", kode);
  });
});
</script>
</body>
</html>
