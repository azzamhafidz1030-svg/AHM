<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>🕌 Arah Kiblat — Azzam</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0C0C0E;
  --surface: #141416;
  --border: #222226;
  --accent: #6EE7B7;
  --accent2: #818CF8;
  --text: #E4E4E7;
  --muted: #71717A;
  --gold: #fbbf24;
  --danger: #f87171;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 5vw;
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  background: rgba(12,12,14,.8);
}
.nav-logo {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem;
  color: var(--accent); letter-spacing: .04em; text-decoration: none;
}
.nav-back {
  color: var(--muted); text-decoration: none; font-size: .8rem;
  font-weight: 500;
}

.wrap {
  max-width: 500px;
  margin: 0 auto;
  padding: 5rem 1rem 2rem;
  text-align: center;
}

.title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.5rem, 5vw, 2rem);
  font-weight: 800;
  margin-bottom: 0.3rem;
}
.subtitle {
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 1.2rem;
}

/* STATUS */
.status {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.8rem 1rem;
  margin-bottom: 1rem;
  font-size: 0.85rem;
  font-weight: 500;
}
.status.ok { border-color: rgba(110,231,183,.5); color: var(--accent); }
.status.err { border-color: rgba(248,113,113,.5); color: var(--danger); }
.status.info { color: var(--accent2); }
.status.warn { border-color: rgba(251,191,36,.5); color: var(--gold); }

/* KOMPAS */
.compass {
  position: relative;
  width: 280px;
  height: 280px;
  margin: 0 auto 1rem;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(110,231,183,.1) 0%, transparent 70%);
  border: 3px solid var(--border);
  transition: border-color 0.3s;
}
.compass.active { border-color: var(--accent); }
.compass.active::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  animation: pulse 2s ease-out infinite;
  pointer-events: none;
}
@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.15); opacity: 0; }
}

.compass .label {
  position: absolute;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--muted);
  z-index: 3;
}
.compass .label.n { top: 8px; left: 50%; transform: translateX(-50%); color: var(--danger); }
.compass .label.e { right: 12px; top: 50%; transform: translateY(-50%); }
.compass .label.s { bottom: 8px; left: 50%; transform: translateX(-50%); }
.compass .label.w { left: 12px; top: 50%; transform: translateY(-50%); }

/* PANAH (diputar sesuai arah kiblat RELATIF ke HP) */
.arrow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  transform-origin: 0 0;
  transition: transform 0.15s ease-out;
  z-index: 2;
}
.arrow::before {
  content: '';
  position: absolute;
  left: -13px;
  top: -125px;
  width: 0;
  height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-bottom: 85px solid var(--gold);
  filter: drop-shadow(0 0 12px rgba(251,191,36,.8));
}
.arrow::after {
  content: '🕋';
  position: absolute;
  left: -16px;
  top: -158px;
  font-size: 1.8rem;
}

/* GARIS TENGAH (arah HP) */
.compass-center {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  border: 4px solid var(--bg);
  transform: translate(-50%, -50%);
  z-index: 4;
  box-shadow: 0 0 16px rgba(110,231,183,.8);
}

/* ANGKA BESAR */
.big-number {
  font-family: 'Syne', sans-serif;
  font-size: 2.6rem;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 0.2rem;
  text-shadow: 0 0 20px rgba(251,191,36,.4);
  font-variant-numeric: tabular-nums;
}
.big-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 1.2rem;
}

/* INFO SENSOR */
.sensor-info {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.sensor-badge {
  padding: 0.3rem 0.8rem;
  border-radius: 100px;
  font-size: 0.7rem;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
}
.sensor-badge.on {
  background: rgba(110,231,183,.1);
  border-color: var(--accent);
  color: var(--accent);
}
.sensor-badge.off {
  background: rgba(248,113,113,.1);
  border-color: var(--danger);
  color: var(--danger);
}

/* TOMBOL */
.btn-big {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: 100%;
  padding: 1rem 1.5rem;
  background: var(--accent);
  color: #0C0C0E;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 0.8rem;
  box-shadow: 0 6px 20px rgba(110,231,183,.25);
  -webkit-user-select: none;
  user-select: none;
}
.btn-big:active { transform: scale(0.97); }
.btn-big.secondary {
  background: transparent;
  color: var(--text);
  border: 2px solid var(--border);
  box-shadow: none;
  font-size: 0.9rem;
  padding: 0.8rem 1rem;
}
.btn-big.hidden { display: none; }

/* FORM MANUAL */
.manual-form {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 1rem;
  text-align: left;
}
.manual-form.show { display: block; }
.manual-form label {
  display: block;
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 0.3rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}
.manual-form input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  margin-bottom: 0.8rem;
}
.manual-form input:focus { outline: none; border-color: var(--accent); }

/* STEPS */
.steps {
  display: flex;
  gap: 0.5rem;
  margin-top: 1.5rem;
}
.step {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.7rem 0.5rem;
  text-align: center;
}
.step .num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  color: #0C0C0E;
  font-weight: 800;
  font-size: 0.75rem;
  font-family: 'Syne', sans-serif;
  margin-bottom: 0.3rem;
}
.step .txt {
  font-size: 0.7rem;
  color: var(--muted);
  line-height: 1.3;
}

footer {
  border-top: 1px solid var(--border);
  padding: 1.5rem 5vw;
  text-align: center;
  font-size: .75rem;
  color: var(--muted);
  margin-top: 2rem;
}
footer a { color: var(--muted); text-decoration: none; }

@media (max-width: 360px) {
  .compass { width: 240px; height: 240px; }
  .arrow::before { top: -108px; border-bottom: 72px solid var(--gold); }
  .arrow::after { top: -138px; font-size: 1.5rem; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">AHM.</a>
  <a href="index.html" class="nav-back">← Kembali</a>
</nav>

<div class="wrap">

  <h1 class="title">🕌 Arah Kiblat</h1>
  <p class="subtitle">Aktifkan kompas HP untuk arah real-time</p>

  <div class="status info" id="status">📡 Mencari lokasimu…</div>

  <!-- SENSOR BADGES -->
  <div class="sensor-info">
    <span class="sensor-badge" id="badgeGPS">📍 GPS</span>
    <span class="sensor-badge" id="badgeCompass">🧭 Kompas</span>
  </div>

  <!-- KOMPAS -->
  <div class="compass" id="compass">
    <span class="label n">U</span>
    <span class="label e">T</span>
    <span class="label s">S</span>
    <span class="label w">B</span>
    <div class="arrow" id="arrow"></div>
    <div class="compass-center"></div>
  </div>

  <div class="big-number" id="bigNumber">—°</div>
  <div class="big-label">Arah dari Utara</div>

  <!-- TOMBOL UTAMA -->
  <button class="btn-big" id="btnActivate">🧭 Aktifkan Kompas HP</button>
  <button class="btn-big secondary" id="btnDetect">📍 Deteksi Ulang Lokasi</button>
  <button class="btn-big secondary" id="btnManual">✏️ Input Koordinat Manual</button>

  <!-- FORM MANUAL -->
  <div class="manual-form" id="manualForm">
    <label>Latitude</label>
    <input type="number" id="latIn" placeholder="-6.2088" step="0.0001" inputmode="decimal" />
    <label>Longitude</label>
    <input type="number" id="lonIn" placeholder="106.8456" step="0.0001" inputmode="decimal" />
    <button class="btn-big" id="btnHitung" style="margin-bottom:0;">🧭 Hitung Arah Kiblat</button>
  </div>

  <!-- STEPS -->
  <div class="steps">
    <div class="step"><div class="num">1</div><div class="txt">Klik <strong>Aktifkan Kompas</strong></div></div>
    <div class="step"><div class="num">2</div><div class="txt">Izinkan <strong>lokasi + sensor</strong></div></div>
    <div class="step"><div class="num">3</div><div class="txt">Putar HP, panah 🕋 ikut muter</div></div>
  </div>

</div>

<footer>
  © 2024 Azzam Hafidz Murobbi · <a href="index.html">Kembali</a>
</footer>

<script>
// ================================================================
// ARAH KIBLAT — VERSI HP-FIRST + SENSOR KOMPAS
// ================================================================
const KAABAH_LAT = 21.4225;
const KAABAH_LON = 39.8262;
const EARTH_RADIUS = 6371;

const statusEl = document.getElementById('status');
const arrow = document.getElementById('arrow');
const bigNumber = document.getElementById('bigNumber');
const compassEl = document.getElementById('compass');
const badgeGPS = document.getElementById('badgeGPS');
const badgeCompass = document.getElementById('badgeCompass');
const btnActivate = document.getElementById('btnActivate');
const btnDetect = document.getElementById('btnDetect');
const btnManual = document.getElementById('btnManual');
const manualForm = document.getElementById('manualForm');
const latIn = document.getElementById('latIn');
const lonIn = document.getElementById('lonIn');
const btnHitung = document.getElementById('btnHitung');

// STATE
let userLat = null;
let userLon = null;
let kiblatBearing = 0;      // arah kiblat dari utara (absolut)
let deviceHeading = 0;      // arah HP menghadap (dari sensor)
let compassActive = false;
let hasCompassSensor = false;

// ===== HITUNG =====
function hitungBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const φ1 = toRad(lat1), φ2 = toRad(lat2), Δλ = toRad(lon2 - lon1);
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  let b = toDeg(Math.atan2(y, x));
  return (b + 360) % 360;
}

function hitungJarak(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δφ = toRad(lat2 - lat1), Δλ = toRad(lon2 - lon1);
  const a = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return EARTH_RADIUS * c;
}

// ===== UPDATE VISUAL =====
function updateCompassVisual() {
  // Sudut panah = kiblat - heading HP
  // Kalau HP menghadap utara (heading 0), panah di kiblat
  // Kalau HP menghadap timur (heading 90), panah mundur 90 derajat
  let arrowRotation = kiblatBearing - deviceHeading;
  arrowRotation = ((arrowRotation % 360) + 360) % 360;

  arrow.style.transform = `rotate(${arrowRotation}deg)`;
}

function updateKiblatData() {
  if (userLat === null || userLon === null) return;
  kiblatBearing = hitungBearing(userLat, userLon, KAABAH_LAT, KAABAH_LON);
  const jarak = hitungJarak(userLat, userLon, KAABAH_LAT, KAABAH_LON);

  bigNumber.textContent = kiblatBearing.toFixed(1) + '°';

  const jarakEl = document.querySelector('.mini-info .val');
  // Update info jika ada
  let infoJarak = document.getElementById('infoJarak');
  if (!infoJarak) {
    const info = document.createElement('div');
    info.className = 'sensor-info';
    info.innerHTML = `<span class="sensor-badge">📏 ${jarak.toFixed(0)} km ke Ka'bah</span>`;
    document.querySelector('.big-label').after(info);
    infoJarak = info;
  } else {
    infoJarak.querySelector('.sensor-badge').textContent = `📏 ${jarak.toFixed(0)} km ke Ka'bah`;
  }

  updateCompassVisual();
}

// ===== DETEKSI LOKASI =====
function deteksiLokasi() {
  if (!navigator.geolocation) {
    statusEl.className = 'status err';
    statusEl.textContent = '❌ Browser tidak mendukung GPS';
    badgeGPS.className = 'sensor-badge off';
    badgeGPS.textContent = '📍 GPS ✗';
    return;
  }

  statusEl.className = 'status info';
  statusEl.textContent = '📡 Meminta izin lokasi…';

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      latIn.value = userLat.toFixed(4);
      lonIn.value = userLon.toFixed(4);
      badgeGPS.className = 'sensor-badge on';
      badgeGPS.textContent = '📍 GPS ✓';
      updateKiblatData();
      statusEl.className = 'status ok';
      statusEl.textContent = '✅ Lokasi terdeteksi!';
      if (!compassActive) {
        statusEl.textContent = '✅ Lokasi OK. Klik "Aktifkan Kompas HP" untuk arah real-time.';
      }
    },
    (err) => {
      console.warn('GPS error:', err);
      badgeGPS.className = 'sensor-badge off';
      badgeGPS.textContent = '📍 GPS ✗';
      statusEl.className = 'status err';
      statusEl.textContent = '⚠️ GPS gagal. Klik "Input Koordinat Manual".';
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

// ===== SENSOR KOMPAS (deviceorientation) =====
function handleOrientation(event) {
  let heading = null;

  // iOS: webkitCompassHeading
  if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
    heading = event.webkitCompassHeading;
  }
  // Android / Chrome: alpha (0-360, arah kompas)
  else if (event.alpha !== null && event.alpha !== undefined) {
    heading = 360 - event.alpha; // Konversi ke arah kompas
  }

  // Fallback pakai absolute orientation
  if (heading === null && event.absolute && event.alpha !== null) {
    heading = 360 - event.alpha;
  }

  if (heading !== null && !isNaN(heading)) {
    deviceHeading = heading;
    hasCompassSensor = true;
    badgeCompass.className = 'sensor-badge on';
    badgeCompass.textContent = '🧭 Kompas ✓';
    updateCompassVisual();
  }
}

// ===== AKTIFKAN KOMPAS (user gesture) =====
async function aktifkanKompas() {
  statusEl.className = 'status info';
  statusEl.textContent = '🔄 Mengaktifkan sensor kompas…';

  // Cek dukungan
  if (!window.DeviceOrientationEvent) {
    statusEl.className = 'status err';
    statusEl.textContent = '❌ HP ini tidak punya sensor arah (deviceorientation).';
    badgeCompass.className = 'sensor-badge off';
    badgeCompass.textContent = '🧭 Kompas ✗';
    return;
  }

  try {
    // iOS 13+ butuh requestPermission
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== 'granted') {
        statusEl.className = 'status err';
        statusEl.textContent = '❌ Izin sensor ditolak. Coba lagi dan klik "Izinkan".';
        return;
      }
    }

    // Pasang listener
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);

    // Tunggu 1 detik, cek apakah sensor ngasih data
    setTimeout(() => {
      if (hasCompassSensor) {
        compassActive = true;
        compassEl.classList.add('active');
        btnActivate.classList.add('hidden');
        statusEl.className = 'status ok';
        statusEl.textContent = '🎉 Kompas aktif! Putar HP, panah 🕋 ikut bergerak.';
      } else {
        statusEl.className = 'status warn';
        statusEl.textContent = '⚠️ Sensor tidak merespon. HP kamu mungkin tidak punya magnetometer. Gunakan arah dari Utara saja.';
        badgeCompass.className = 'sensor-badge off';
        badgeCompass.textContent = '🧭 Kompas ✗';
        // Tetap aktifkan visual meski tanpa sensor
        compassActive = true;
        compassEl.classList.add('active');
        btnActivate.classList.add('hidden');
      }
    }, 1500);

  } catch (err) {
    console.error('Sensor error:', err);
    statusEl.className = 'status err';
    statusEl.textContent = '❌ Gagal aktifkan sensor: ' + err.message;
  }
}

// ===== EVENT BINDING =====
btnActivate.addEventListener('click', aktifkanKompas);
btnDetect.addEventListener('click', deteksiLokasi);

btnManual.addEventListener('click', () => {
  manualForm.classList.toggle('show');
});

btnHitung.addEventListener('click', () => {
  const lat = parseFloat(latIn.value);
  const lon = parseFloat(lonIn.value);
  if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
    statusEl.className = 'status err';
    statusEl.textContent = '❌ Koordinat tidak valid!';
    return;
  }
  userLat = lat;
  userLon = lon;
  badgeGPS.className = 'sensor-badge on';
  badgeGPS.textContent = '📍 Manual ✓';
  updateKiblatData();
  statusEl.className = 'status ok';
  statusEl.textContent = '✅ Arah kiblat dihitung dari koordinat manual.';
});

// ===== INIT =====
// Cek apakah deviceorientation tersedia
if (!window.DeviceOrientationEvent) {
  badgeCompass.className = 'sensor-badge off';
  badgeCompass.textContent = '🧭 Kompas ✗';
} else {
  badgeCompass.textContent = '🧭 Kompas ?';
}

// Auto-deteksi lokasi saat halaman dibuka
deteksiLokasi();

console.log('🕌 Arah Kiblat HP-first siap!');
</script>
</body>
</html>
