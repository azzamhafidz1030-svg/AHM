<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>🕋 Qibla Finder — Azzam</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0C0C0E; --surface: #141416; --border: #222226;
  --accent: #6EE7B7; --accent2: #818CF8;
  --text: #E4E4E7; --muted: #71717A;
  --gold: #fbbf24; --danger: #f87171;
}
html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  background: #000;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}

/* ===== KAMERA FULLSCREEN ===== */
#camera {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  background: #000;
  z-index: 1;
}

/* ===== OVERLAY HITAM TRANSPARAN ===== */
.overlay {
  position: fixed; inset: 0;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 100%);
}

/* ===== HEADER ===== */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 10;
  padding: 1rem 1.2rem;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  pointer-events: auto;
}
.header .logo {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: 1rem; color: var(--accent);
  text-decoration: none; letter-spacing: 0.05em;
  display: flex; align-items: center; gap: 0.4rem;
}
.header .back {
  color: #fff; text-decoration: none;
  font-size: 1.4rem; padding: 0.3rem 0.7rem;
  background: rgba(0,0,0,0.5);
  border-radius: 50%; backdrop-filter: blur(8px);
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}

/* ===== KA'BAH OVERLAY ===== */
.kaabah-overlay {
  position: fixed; inset: 0;
  z-index: 3;
  pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.kaabah-overlay.visible { opacity: 1; }

.kaabah-target {
  position: absolute;
  width: 140px; height: 140px;
  transform-origin: center;
  transition: transform 0.1s linear;
}

.kaabah-target .cube {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 6rem;
  filter: drop-shadow(0 0 32px rgba(251,191,36,0.9));
  animation: floatKaabah 2s ease-in-out infinite;
}
@keyframes floatKaabah {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.05); }
}

.kaabah-target .ring {
  position: absolute; inset: -30px;
  border: 3px solid var(--gold);
  border-radius: 50%;
  opacity: 0.6;
  animation: pulseRing 1.5s ease-out infinite;
}
@keyframes pulseRing {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.3); opacity: 0; }
}

.kaabah-target .label {
  position: absolute;
  bottom: -50px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: var(--gold);
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 0.3rem 0.8rem;
  border-radius: 100px;
  white-space: nowrap;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(251,191,36,0.4);
}

/* ===== PANAH KIBLAT ATAS ===== */
.top-arrow {
  position: fixed; top: 80px; left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  display: flex; flex-direction: column;
  align-items: center;
  pointer-events: none;
  transition: opacity 0.3s;
  opacity: 0;
}
.top-arrow.visible { opacity: 1; }

.top-arrow .bubble {
  background: rgba(0,0,0,0.75);
  border: 1px solid var(--gold);
  border-radius: 100px;
  padding: 0.5rem 1rem;
  backdrop-filter: blur(12px);
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--gold);
  white-space: nowrap;
  margin-bottom: 0.5rem;
}
.top-arrow .tri {
  width: 0; height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 18px solid var(--gold);
  filter: drop-shadow(0 0 8px rgba(251,191,36,0.8));
  animation: bounceDown 1.2s ease-in-out infinite;
}
@keyframes bounceDown {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

/* ===== GARIS TENGAH ===== */
.center-crosshair {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 4;
  pointer-events: none;
}
.center-crosshair::before,
.center-crosshair::after {
  content: '';
  position: absolute;
  background: rgba(255,255,255,0.7);
}
.center-crosshair::before {
  width: 40px; height: 2px;
  top: 0; left: -20px;
}
.center-crosshair::after {
  width: 2px; height: 40px;
  left: 0; top: -20px;
}
.center-crosshair .dot {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--gold);
  border-radius: 50%;
  top: -4px; left: -4px;
  box-shadow: 0 0 12px var(--gold);
}

/* ===== PANEL INFO BAWAH ===== */
.bottom-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 10;
  padding: 1rem 1.2rem 1.5rem;
  background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  pointer-events: auto;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.6rem;
  margin-bottom: 0.8rem;
}
.stat {
  background: rgba(20,20,22,0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 0.7rem 0.5rem;
  text-align: center;
}
.stat .val {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  margin-bottom: 0.1rem;
}
.stat .lbl {
  font-size: 0.6rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.status-line {
  text-align: center;
  font-size: 0.8rem;
  color: var(--text);
  padding: 0.5rem 1rem;
  background: rgba(20,20,22,0.85);
  backdrop-filter: blur(12px);
  border-radius: 100px;
  display: inline-block;
  margin: 0 auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.status-line.ok { color: var(--accent); border: 1px solid rgba(110,231,183,0.3); }
.status-line.warn { color: var(--gold); border: 1px solid rgba(251,191,36,0.3); }
.status-line.err { color: var(--danger); border: 1px solid rgba(248,113,113,0.3); }
.status-line.info { color: var(--accent2); border: 1px solid rgba(129,140,248,0.3); }

/* ===== TOMBOL START ===== */
.start-screen {
  position: fixed; inset: 0;
  z-index: 100;
  background: linear-gradient(135deg, #0C0C0E 0%, #141420 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem;
  text-align: center;
  transition: opacity 0.4s;
}
.start-screen.hidden { opacity: 0; pointer-events: none; }

.start-screen .icon {
  font-size: 5rem;
  margin-bottom: 1rem;
  animation: floatKaabah 3s ease-in-out infinite;
}
.start-screen h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.8rem, 6vw, 2.5rem);
  font-weight: 800;
  margin-bottom: 0.5rem;
}
.start-screen h1 em {
  font-style: normal;
  background: linear-gradient(135deg, var(--gold), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.start-screen p {
  color: var(--muted);
  font-size: 0.95rem;
  max-width: 32ch;
  margin-bottom: 2rem;
  line-height: 1.6;
}

.btn-start {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  padding: 1.1rem 2.5rem;
  background: var(--gold);
  color: #0C0C0E;
  border: none;
  border-radius: 100px;
  font-size: 1.05rem;
  font-weight: 800;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  box-shadow: 0 12px 32px rgba(251,191,36,0.4);
  transition: all 0.2s;
  margin-bottom: 1rem;
}
.btn-start:hover { transform: scale(1.05); box-shadow: 0 16px 40px rgba(251,191,36,0.6); }
.btn-start:active { transform: scale(0.98); }

.start-screen .hint {
  color: var(--muted);
  font-size: 0.75rem;
  line-height: 1.5;
}

/* ===== LOADING ===== */
.loading {
  position: fixed; inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.9);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text);
}
.loading.show { display: flex; }
.loading .spinner {
  width: 48px; height: 48px;
  border: 4px solid rgba(251,191,36,0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== MINI MAP ===== */
.mini-map {
  position: fixed;
  top: 80px; right: 1rem;
  width: 100px; height: 100px;
  z-index: 8;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid rgba(251,191,36,0.4);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.mini-map svg { width: 100%; height: 100%; }

/* ===== HILANGKAN MINI MAP DI HP KECIL ===== */
@media (max-width: 400px) {
  .mini-map { width: 80px; height: 80px; top: 70px; }
}
</style>
</head>
<body>

<!-- KAMERA -->
<video id="camera" autoplay playsinline muted></video>

<!-- OVERLAY GELAP -->
<div class="overlay"></div>

<!-- HEADER -->
<div class="header">
  <a href="index.html" class="logo">🕋 Qibla Finder</a>
  <a href="index.html" class="back" title="Kembali">←</a>
</div>

<!-- MINI MAP -->
<div class="mini-map">
  <svg viewBox="0 0 100 100">
    <!-- Bumi -->
    <circle cx="50" cy="50" r="40" fill="none" stroke="#222226" stroke-width="1"/>
    <!-- Lingkaran lintang -->
    <ellipse cx="50" cy="50" rx="40" ry="20" fill="none" stroke="#222226" stroke-width="0.5"/>
    <ellipse cx="50" cy="50" rx="20" ry="40" fill="none" stroke="#222226" stroke-width="0.5"/>
    <!-- Garis khatulistiwa -->
    <line x1="10" y1="50" x2="90" y2="50" stroke="#222226" stroke-width="0.5"/>
    <line x1="50" y1="10" x2="50" y2="90" stroke="#222226" stroke-width="0.5"/>
    <!-- Posisi user (titik biru) -->
    <circle id="mapUser" cx="50" cy="50" r="3" fill="#6EE7B7"/>
    <!-- Posisi Ka'bah (titik emas) -->
    <circle id="mapKaabah" cx="50" cy="50" r="3" fill="#fbbf24"/>
    <!-- Garis penghubung -->
    <line id="mapLine" x1="50" y1="50" x2="50" y2="50" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2"/>
  </svg>
</div>

<!-- KA'BAH OVERLAY (AR) -->
<div class="kaabah-overlay" id="kaabahOverlay">
  <div class="kaabah-target" id="kaabahTarget">
    <div class="ring"></div>
    <div class="cube">🕋</div>
    <div class="label" id="kaabahLabel">Ka'bah</div>
  </div>
</div>

<!-- PANAH ATAS -->
<div class="top-arrow" id="topArrow">
  <div class="bubble" id="topArrowBubble">Putar HP ke kanan →</div>
  <div class="tri"></div>
</div>

<!-- CROSSHAIR -->
<div class="center-crosshair">
  <div class="dot"></div>
</div>

<!-- PANEL BAWAH -->
<div class="bottom-panel">
  <div class="stats-grid">
    <div class="stat">
      <div class="val" id="statKiblat">—°</div>
      <div class="lbl">Kiblat</div>
    </div>
    <div class="stat">
      <div class="val" id="statHeading">—°</div>
      <div class="lbl">HP</div>
    </div>
    <div class="stat">
      <div class="val" id="statJarak">—</div>
      <div class="lbl">Jarak</div>
    </div>
  </div>
  <div style="text-align:center;">
    <div class="status-line info" id="statusLine">Memuat…</div>
  </div>
</div>

<!-- START SCREEN -->
<div class="start-screen" id="startScreen">
  <div class="icon">🕋</div>
  <h1>Qibla <em>Finder</em></h1>
  <p>Arahkan kamera ke sekitar, dan ikuti panah untuk menemukan arah kiblat.</p>
  <button class="btn-start" id="btnStart">🚀 Mulai</button>
  <div class="hint">
    📷 Butuh izin kamera + lokasi + sensor<br>
    🌐 Wajib HTTPS atau localhost
  </div>
</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div id="loadingText">Menyiapkan…</div>
</div>

<script>
// ================================================================
// QIBLA FINDER — KAMERA + AR
// ================================================================
const KAABAH_LAT = 21.4225;
const KAABAH_LON = 39.8262;
const R_EARTH = 6371;

const video = document.getElementById('camera');
const kaabahOverlay = document.getElementById('kaabahOverlay');
const kaabahTarget = document.getElementById('kaabahTarget');
const kaabahLabel = document.getElementById('kaabahLabel');
const topArrow = document.getElementById('topArrow');
const topArrowBubble = document.getElementById('topArrowBubble');
const statKiblat = document.getElementById('statKiblat');
const statHeading = document.getElementById('statHeading');
const statJarak = document.getElementById('statJarak');
const statusLine = document.getElementById('statusLine');
const startScreen = document.getElementById('startScreen');
const btnStart = document.getElementById('btnStart');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const mapUser = document.getElementById('mapUser');
const mapKaabah = document.getElementById('mapKaabah');
const mapLine = document.getElementById('mapLine');

let userLat = null;
let userLon = null;
let kiblatBearing = 0;
let deviceHeading = 0;
let jarak = 0;
let sensorActive = false;
let cameraStream = null;

// ===== HELPER =====
function setStatus(msg, type = 'info') {
  statusLine.className = 'status-line ' + type;
  statusLine.textContent = msg;
}

function showLoading(text) {
  loadingText.textContent = text;
  loading.classList.add('show');
}
function hideLoading() {
  loading.classList.remove('show');
}

// ===== HITUNG =====
function hitungBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δλ = toRad(lon2 - lon1);
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function hitungJarak(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δφ = toRad(lat2 - lat1), Δλ = toRad(lon2 - lon1);
  const a = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
  return R_EARTH * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ===== RENDER UI =====
function render() {
  if (kiblatBearing === 0 || !sensorActive) {
    kaabahOverlay.classList.remove('visible');
    topArrow.classList.remove('visible');
    return;
  }

  // Selisih antara arah kiblat dan arah HP
  let diff = kiblatBearing - deviceHeading;
  // Normalisasi ke -180..180
  while (diff > 180) diff -= 360;
  while (diff < -180) diff += 360;

  const absDiff = Math.abs(diff);

  // Update stats
  statKiblat.textContent = kiblatBearing.toFixed(1) + '°';
  statHeading.textContent = deviceHeading.toFixed(1) + '°';
  statJarak.textContent = jarak.toFixed(0) + ' km';

  // Kalau HP menghadap kiblat (selisih < 15°)
  if (absDiff < 15) {
    // Tampilkan Ka'bah
    kaabahOverlay.classList.add('visible');
    kaabahTarget.style.transform = `translateX(${diff * 8}px) scale(${1 - absDiff/60})`;
    kaabahLabel.textContent = absDiff < 5 ? '🎯 Tepat!' : 'Mendekati…';
    topArrow.classList.remove('visible');
    setStatus('✅ Kamu menghadap kiblat!', 'ok');
  }
  // Kalau selisih 15-90° → tampilkan panah
  else if (absDiff < 90) {
    kaabahOverlay.classList.add('visible');
    kaabahTarget.style.transform = `translateX(${Math.sign(diff) * 200}px) scale(0.6)`;
    kaabahLabel.textContent = jarak.toFixed(0) + ' km';
    topArrow.classList.remove('visible');

    if (diff > 0) {
      setStatus('Putar HP ke kanan →', 'info');
    } else {
      setStatus('← Putar HP ke kiri', 'info');
    }
  }
  // Selisih > 90° → tampilkan panah besar di atas
  else {
    kaabahOverlay.classList.remove('visible');
    topArrow.classList.add('visible');

    if (diff > 0) {
      topArrowBubble.textContent = `Putar ke kanan ${absDiff.toFixed(0)}° →`;
    } else {
      topArrowBubble.textContent = `← Putar ke kiri ${absDiff.toFixed(0)}°`;
    }
    setStatus('Putar HP untuk menemukan kiblat', 'warn');
  }
}

// ===== SENSOR =====
function handleOrientation(e) {
  let heading = null;
  let source = '';

  // iOS
  if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) {
    heading = e.webkitCompassHeading;
    source = 'iOS';
  }
  // Android absolute
  else if (e.type === 'deviceorientationabsolute' && e.alpha !== null) {
    heading = (360 - e.alpha) % 360;
    source = 'Android-abs';
  }
  // Fallback
  else if (e.alpha !== null && e.alpha !== undefined) {
    heading = (360 - e.alpha) % 360;
    source = 'fallback';
  }

  if (heading === null || isNaN(heading)) return;

  deviceHeading = heading;
  if (!sensorActive) {
    sensorActive = true;
    setStatus('🧭 Sensor aktif. Putar HP untuk cari kiblat.', 'ok');
  }
  render();
}

// ===== KAMERA =====
async function mulaiKamera() {
  showLoading('Mengaktifkan kamera…');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = cameraStream;
    await video.play();
    return true;
  } catch (err) {
    console.warn('Kamera gagal:', err);
    setStatus('❌ Kamera tidak bisa diakses. Cek izin browser.', 'err');
    return false;
  }
}

// ===== LOKASI =====
function ambilLokasi() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve(false);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        kiblatBearing = hitungBearing(userLat, userLon, KAABAH_LAT, KAABAH_LON);
        jarak = hitungJarak(userLat, userLon, KAABAH_LAT, KAABAH_LON);
        updateMiniMap();
        resolve(true);
      },
      (err) => {
        console.warn('GPS gagal:', err);
        setStatus('⚠️ GPS gagal. Coba izinkan lokasi.', 'err');
        resolve(false);
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

// ===== MINI MAP =====
function updateMiniMap() {
  if (userLat === null || userLon === null) return;

  // Proyeksi sederhana ke 100x100
  const x = ((userLon + 180) / 360) * 100;
  const y = ((90 - userLat) / 180) * 100;
  mapUser.setAttribute('cx', x);
  mapUser.setAttribute('cy', y);

  // Ka'bah
  const kx = ((KAABAH_LON + 180) / 360) * 100;
  const ky = ((90 - KAABAH_LAT) / 180) * 100;
  mapKaabah.setAttribute('cx', kx);
  mapKaabah.setAttribute('cy', ky);

  // Garis penghubung
  mapLine.setAttribute('x1', x);
  mapLine.setAttribute('y1', y);
  mapLine.setAttribute('x2', kx);
  mapLine.setAttribute('y2', ky);
}

// ===== SENSOR IZIN =====
async function aktifkanSensor() {
  if (!window.DeviceOrientationEvent) {
    setStatus('❌ HP tidak punya sensor kompas.', 'err');
    return false;
  }

  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm !== 'granted') {
        setStatus('❌ Izin sensor ditolak.', 'err');
        return false;
      }
    } catch (err) {
      setStatus('❌ Error izin sensor: ' + err.message, 'err');
      return false;
    }
  }

  window.addEventListener('deviceorientationabsolute', handleOrientation, true);
  window.addEventListener('deviceorientation', handleOrientation, true);
  return true;
}

// ===== MULAI =====
btnStart.addEventListener('click', async () => {
  btnStart.disabled = true;

  // 1. Kamera
  const kameraOK = await mulaiKamera();
  if (!kameraOK) {
    hideLoading();
    btnStart.disabled = false;
    return;
  }

  // 2. Lokasi
  showLoading('Mendeteksi lokasi…');
  await ambilLokasi();

  // 3. Sensor
  showLoading('Mengaktifkan sensor…');
  await aktifkanSensor();

  // 4. Sembunyikan start screen
  hideLoading();
  startScreen.classList.add('hidden');

  // Pesan
  if (userLat !== null) {
    setStatus('✅ Siap! Putar HP untuk cari arah kiblat.', 'ok');
  } else {
    setStatus('⚠️ Lokasi tidak terdeteksi. Coba refresh & izinkan lokasi.', 'warn');
  }

  // Mulai render loop (untuk smoothing)
  setInterval(() => {
    if (sensorActive) render();
  }, 100);
});

// ===== CEK DUKUNGAN =====
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  setStatus('❌ Browser tidak mendukung kamera. Gunakan Chrome/Safari terbaru.', 'err');
}

console.log('🕋 Qibla Finder siap!');
</script>
</body>
</html>
