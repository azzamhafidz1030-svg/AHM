<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>🕋 Qibla Finder — Azzam</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0C0C0E; --surface: #141416; --border: #222226;
  --accent: #6EE7B7; --accent2: #818CF8;
  --text: #E4E4E7; --muted: #71717A;
  --gold: #fbbf24; --danger: #f87171;
}
html, body {
  height: 100%; width: 100%;
  overflow: hidden; background: #000;
  color: var(--text); font-family: 'Inter', sans-serif;
  touch-action: none;
}

#camera {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: cover; background: #000; z-index: 1;
}

/* ===== HEADER ===== */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 10; padding: 1rem 1.2rem;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
}
.header .logo {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: 1rem; color: var(--accent); text-decoration: none;
}
.header .back {
  color: #fff; text-decoration: none; font-size: 1.4rem;
  width: 36px; height: 36px; background: rgba(0,0,0,0.5);
  border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-weight: 700;
}

/* ===== OVERLAY KA'BAH ===== */
.kaabah-overlay {
  position: fixed; inset: 0; z-index: 3;
  pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.kaabah-overlay.visible { opacity: 1; }
.kaabah-target {
  position: absolute;
  font-size: 8rem;
  filter: drop-shadow(0 0 32px rgba(251,191,36,0.9));
  transition: transform 0.1s linear;
}

/* ===== PANAH ATAS ===== */
.top-arrow {
  position: fixed; top: 80px; left: 50%;
  transform: translateX(-50%);
  z-index: 5; opacity: 0;
  transition: opacity 0.3s;
  display: flex; flex-direction: column;
  align-items: center;
}
.top-arrow.visible { opacity: 1; }
.top-arrow .bubble {
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--gold);
  border-radius: 100px;
  padding: 0.5rem 1rem;
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 0.9rem;
  color: var(--gold); white-space: nowrap;
  margin-bottom: 0.5rem;
}

/* ===== CROSSHAIR ===== */
.crosshair {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 4; pointer-events: none;
}
.crosshair::before, .crosshair::after {
  content: ''; position: absolute;
  background: rgba(255,255,255,0.8);
}
.crosshair::before { width: 50px; height: 2px; top: 0; left: -25px; }
.crosshair::after { width: 2px; height: 50px; left: 0; top: -25px; }
.crosshair .dot {
  position: absolute; width: 10px; height: 10px;
  background: var(--gold); border-radius: 50%;
  top: -5px; left: -5px;
  box-shadow: 0 0 16px var(--gold);
}

/* ===== PANEL BAWAH ===== */
.bottom {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 10; padding: 1rem 1.2rem 1.5rem;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem; margin-bottom: 0.6rem;
}
.stat {
  background: rgba(20,20,22,0.9);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 0.6rem 0.4rem;
  text-align: center;
}
.stat .v {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 1rem;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
.stat .l {
  font-size: 0.6rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em;
}

.status {
  text-align: center; font-size: 0.8rem;
  padding: 0.5rem 1rem;
  background: rgba(20,20,22,0.9);
  backdrop-filter: blur(12px);
  border-radius: 100px;
  color: var(--text); margin-bottom: 0.6rem;
}
.status.ok { color: var(--accent); }
.status.warn { color: var(--gold); }
.status.err { color: var(--danger); }

/* ===== KALIBRASI ===== */
.calib-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.4rem;
  margin-top: 0.4rem;
}
.calib-row button {
  padding: 0.6rem 0.4rem;
  border-radius: 8px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.7rem;
  cursor: pointer;
  border: 1px solid;
  background: transparent;
}
.calib-row .green { color: var(--accent); border-color: rgba(110,231,183,0.5); background: rgba(110,231,183,0.1); }
.calib-row .yellow { color: var(--gold); border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.1); }
.calib-row .red { color: var(--danger); border-color: rgba(248,113,113,0.5); background: rgba(248,113,113,0.1); }

/* ===== DEBUG PANEL ===== */
.debug {
  position: fixed;
  top: 60px; left: 1rem;
  z-index: 11;
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: var(--accent);
  line-height: 1.5;
  max-width: 200px;
  pointer-events: none;
}
.debug .row { display: flex; justify-content: space-between; gap: 1rem; }
.debug .k { color: var(--muted); }

/* ===== START SCREEN ===== */
.start {
  position: fixed; inset: 0; z-index: 100;
  background: linear-gradient(135deg, #0C0C0E, #141420);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem; text-align: center;
  transition: opacity 0.4s;
}
.start.hide { opacity: 0; pointer-events: none; }
.start .icon {
  font-size: 5rem; margin-bottom: 1rem;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.start h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.8rem, 6vw, 2.5rem);
  font-weight: 800; margin-bottom: 0.5rem;
}
.start h1 em {
  font-style: normal;
  background: linear-gradient(135deg, var(--gold), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.start p {
  color: var(--muted); font-size: 0.95rem;
  max-width: 32ch; margin-bottom: 2rem;
  line-height: 1.6;
}
.btn-start {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.6rem; padding: 1.1rem 2.5rem;
  background: var(--gold); color: #0C0C0E;
  border: none; border-radius: 100px;
  font-size: 1.05rem; font-weight: 800;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  box-shadow: 0 12px 32px rgba(251,191,36,0.4);
}
.btn-start:active { transform: scale(0.97); }

.loading {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.92);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
}
.loading.show { display: flex; }
.loading .spin {
  width: 48px; height: 48px;
  border: 4px solid rgba(251,191,36,0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>

<div class="header">
  <a href="index.html" class="logo">🕋 Qibla Finder</a>
  <a href="index.html" class="back">←</a>
</div>

<!-- DEBUG PANEL -->
<div class="debug" id="debug">
  <div class="row"><span class="k">Kiblat:</span><span id="dbgKiblat">—</span></div>
  <div class="row"><span class="k">HP mentah:</span><span id="dbgRaw">—</span></div>
  <div class="row"><span class="k">HP koreksi:</span><span id="dbgHeading">—</span></div>
  <div class="row"><span class="k">Selisih:</span><span id="dbgDiff">—</span></div>
  <div class="row"><span class="k">Sumber:</span><span id="dbgSource">—</span></div>
  <div class="row"><span class="k">Offset:</span><span id="dbgOffset">—</span></div>
</div>

<div class="kaabah-overlay" id="kaabahOverlay">
  <div class="kaabah-target" id="kaabahTarget">🕋</div>
</div>

<div class="top-arrow" id="topArrow">
  <div class="bubble" id="topArrowBubble">—</div>
</div>

<div class="crosshair"><div class="dot"></div></div>

<div class="bottom">
  <div class="stats">
    <div class="stat"><div class="v" id="sKiblat">—°</div><div class="l">Kiblat</div></div>
    <div class="stat"><div class="v" id="sHeading">—°</div><div class="l">HP</div></div>
    <div class="stat"><div class="v" id="sJarak">—</div><div class="l">Jarak</div></div>
  </div>
  <div class="status" id="status">Memuat…</div>
  <div class="calib-row">
    <button class="green" id="btnNorth">🧭 Set Utara</button>
    <button class="yellow" id="btnInvert">🔄 Balik Arah</button>
    <button class="red" id="btnReset">♻️ Reset</button>
  </div>
</div>

<div class="start" id="start">
  <div class="icon">🕋</div>
  <h1>Qibla <em>Finder</em></h1>
  <p>Arahkan kamera, ikuti panah ke arah kiblat.</p>
  <button class="btn-start" id="btnStart">🚀 Mulai</button>
</div>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div id="loadingText">Menyiapkan…</div>
</div>

<script>
// ================================================================
// QIBLA FINDER — DEBUG VERSION
// ================================================================
const KAABAH_LAT = 21.4225;
const KAABAH_LON = 39.8262;
const R_EARTH = 6371;

const video = document.getElementById('camera');
const kaabahOverlay = document.getElementById('kaabahOverlay');
const kaabahTarget = document.getElementById('kaabahTarget');
const topArrow = document.getElementById('topArrow');
const topArrowBubble = document.getElementById('topArrowBubble');
const statusEl = document.getElementById('status');
const startScreen = document.getElementById('start');
const btnStart = document.getElementById('btnStart');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const sKiblat = document.getElementById('sKiblat');
const sHeading = document.getElementById('sHeading');
const sJarak = document.getElementById('sJarak');
const dbgKiblat = document.getElementById('dbgKiblat');
const dbgRaw = document.getElementById('dbgRaw');
const dbgHeading = document.getElementById('dbgHeading');
const dbgDiff = document.getElementById('dbgDiff');
const dbgSource = document.getElementById('dbgSource');
const dbgOffset = document.getElementById('dbgOffset');

// STATE
let userLat = null;
let userLon = null;
let kiblatBearing = 0;
let jarak = 0;
let rawHeading = 0;         // nilai mentah dari sensor
let deviceHeading = 0;      // setelah koreksi
let sensorSource = '';
let sensorActive = false;
let stream = null;

// KALIBRASI
let calibrationOffset = 0;
let invertAxis = false;

// ===== HELPER =====
function setStatus(msg, type = 'info') {
  statusEl.className = 'status ' + type;
  statusEl.textContent = msg;
}
function norm(d) { return ((d % 360) + 360) % 360; }
function angleDiff(a, b) {
  let d = a - b;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}

// ===== HITUNG =====
function hitungBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δλ = toRad(lon2 - lon1);
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return norm(toDeg(Math.atan2(y, x)));
}

function hitungJarak(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δφ = toRad(lat2 - lat1), Δλ = toRad(lon2 - lon1);
  const a = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
  return R_EARTH * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ===== RENDER =====
function render() {
  // Debug
  dbgKiblat.textContent = kiblatBearing.toFixed(1) + '°';
  dbgRaw.textContent = rawHeading.toFixed(1) + '°';
  dbgHeading.textContent = deviceHeading.toFixed(1) + '°';
  dbgSource.textContent = sensorSource || '—';
  dbgOffset.textContent = calibrationOffset.toFixed(1) + '°' + (invertAxis ? ' INV' : '');

  sKiblat.textContent = kiblatBearing.toFixed(1) + '°';
  sHeading.textContent = deviceHeading.toFixed(1) + '°';
  sJarak.textContent = jarak.toFixed(0) + ' km';

  if (kiblatBearing === 0 || !sensorActive) {
    kaabahOverlay.classList.remove('visible');
    topArrow.classList.remove('visible');
    dbgDiff.textContent = '—';
    return;
  }

  const diff = angleDiff(kiblatBearing, deviceHeading);
  const absDiff = Math.abs(diff);
  dbgDiff.textContent = diff.toFixed(1) + '°';

  // Tampilkan Ka'bah
  if (absDiff < 20) {
    kaabahOverlay.classList.add('visible');
    const xOff = diff * 10;
    const scale = Math.max(0.5, 1 - absDiff / 40);
    kaabahTarget.style.transform = `translateX(${xOff}px) scale(${scale})`;
    topArrow.classList.remove('visible');
    setStatus('✅ Menghadap kiblat!', 'ok');
  } else if (absDiff < 100) {
    kaabahOverlay.classList.add('visible');
    kaabahTarget.style.transform = `translateX(${Math.sign(diff) * 250}px) scale(0.5)`;
    topArrow.classList.remove('visible');
    setStatus(diff > 0 ? 'Putar HP ke kanan →' : '← Putar HP ke kiri', 'info');
  } else {
    kaabahOverlay.classList.remove('visible');
    topArrow.classList.add('visible');
    topArrowBubble.textContent = diff > 0
      ? `Putar ke kanan ${absDiff.toFixed(0)}° →`
      : `← Putar ke kiri ${absDiff.toFixed(0)}°`;
    setStatus('Putar HP untuk cari kiblat', 'warn');
  }
}

// ===== SENSOR HANDLER =====
function handleOrientation(e) {
  let h = null;
  let src = '';

  // iOS
  if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) {
    h = e.webkitCompassHeading;
    src = 'iOS';
  }
  // Android absolute
  else if (e.type === 'deviceorientationabsolute' && e.alpha !== null && e.alpha !== undefined) {
    h = invertAxis ? e.alpha : (360 - e.alpha) % 360;
    src = 'AND-abs' + (invertAxis ? ' INV' : '');
  }
  // Fallback
  else if (e.alpha !== null && e.alpha !== undefined) {
    h = invertAxis ? e.alpha : (360 - e.alpha) % 360;
    src = 'AND-fb' + (invertAxis ? ' INV' : '');
  }

  if (h === null || isNaN(h)) return;

  rawHeading = norm(h);
  deviceHeading = norm(rawHeading + calibrationOffset);

  if (!sensorActive) {
    sensorActive = true;
  }

  sensorSource = src;
  render();
}

// ===== KALIBRASI =====
document.getElementById('btnNorth').addEventListener('click', () => {
  // Set rawHeading saat ini sebagai 0° (utara)
  calibrationOffset = norm(0 - rawHeading);
  setStatus('✅ Utara di-set. Cek: putar HP ke kanan, angka HP naik?', 'ok');
  render();
});

document.getElementById('btnInvert').addEventListener('click', () => {
  invertAxis = !invertAxis;
  setStatus(invertAxis ? '🔄 Mode kebalik aktif.' : '🔄 Mode normal.', 'warn');
  render();
});

document.getElementById('btnReset').addEventListener('click', () => {
  calibrationOffset = 0;
  invertAxis = false;
  setStatus('♻️ Reset ke default.', 'info');
  render();
});

// ===== KAMERA =====
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (err) {
    setStatus('❌ Kamera gagal: ' + err.message, 'err');
    return false;
  }
}

// ===== LOKASI =====
function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(false); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        kiblatBearing = hitungBearing(userLat, userLon, KAABAH_LAT, KAABAH_LON);
        jarak = hitungJarak(userLat, userLon, KAABAH_LAT, KAABAH_LON);
        resolve(true);
      },
      () => resolve(false),
      { enableHighAccuracy: true, timeout: 15000 }
    );
  });
}

// ===== SENSOR PERMISSION =====
async function enableSensor() {
  if (!window.DeviceOrientationEvent) return false;

  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const p = await DeviceOrientationEvent.requestPermission();
      if (p !== 'granted') return false;
    } catch (e) { return false; }
  }

  // Prioritas: absolute dulu
  window.addEventListener('deviceorientationabsolute', handleOrientation, true);
  window.addEventListener('deviceorientation', handleOrientation, true);
  return true;
}

// ===== START =====
btnStart.addEventListener('click', async () => {
  btnStart.disabled = true;

  loadingText.textContent = 'Mengaktifkan kamera…';
  loading.classList.add('show');
  const camOK = await startCamera();
  if (!camOK) {
    loading.classList.remove('show');
    btnStart.disabled = false;
    return;
  }

  loadingText.textContent = 'Mendeteksi lokasi…';
  await getLocation();

  loadingText.textContent = 'Mengaktifkan sensor…';
  await enableSensor();

  // Tunggu 1 detik biar sensor ngasih data
  await new Promise(r => setTimeout(r, 1000));

  loading.classList.remove('show');
  startScreen.classList.add('hide');

  if (userLat !== null) {
    setStatus('✅ Siap! Kalau arah salah, pakai tombol kalibrasi.', 'ok');
  } else {
    setStatus('⚠️ Lokasi tidak terdeteksi.', 'warn');
  }

  // Render loop
  setInterval(render, 100);
});

console.log('🕋 Qibla Finder Debug siap!');
</script>
</body>
</html>
