<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎵 Music Player — Azzam</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0C0C0E;
      --surface: #141416;
      --border:  #222226;
      --accent:  #6EE7B7;
      --accent2: #818CF8;
      --text:    #E4E4E7;
      --muted:   #71717A;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 820px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      margin-top: 1rem;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .back-link:hover { border-color: var(--accent); color: var(--accent); }

    /* UPLOAD AREA */
    .upload-area {
      margin-bottom: 1rem;
    }
    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: var(--bg);
      border: 2px dashed var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }
    .upload-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .upload-btn input {
      display: none;
    }

    /* NOW PLAYING */
    .now-playing {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      min-height: 4.5rem;
    }
    .now-playing .cover-icon {
      font-size: 2.2rem;
      width: 48px;
      text-align: center;
      flex-shrink: 0;
    }
    .now-playing .info {
      flex: 1;
      min-width: 0;
    }
    .now-playing .info .name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-playing .info .status {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .now-playing .info .status.playing { color: var(--accent); }
    .now-playing .info .status.paused { color: #fbbf24; }

    /* CONTROLS */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 0.5rem;
      background: var(--bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .controls button {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      transition: color 0.2s, transform 0.15s;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .controls button:hover { color: var(--accent); transform: scale(1.08); }
    .controls button.play-btn {
      font-size: 2rem;
      color: var(--accent);
      background: rgba(110,231,183,0.08);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      padding: 0;
    }
    .controls button.play-btn:hover { background: rgba(110,231,183,0.18); }
    .controls .progress-wrap {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      min-width: 80px;
    }
    .controls .progress-wrap .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 4px;
      transition: width 0.1s linear;
    }
    .controls .time-label {
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 44px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* VOLUME */
    .volume-section {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.3rem 0.5rem 0.5rem;
      margin-bottom: 1rem;
    }
    .volume-section .vol-icon {
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
      line-height: 1;
    }
    .volume-section .vol-icon:hover { color: var(--text); }
    .volume-section input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      background: var(--border);
      height: 3px;
      border-radius: 2px;
      cursor: pointer;
    }
    .volume-section input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* PLAYLIST */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      padding: 0.5rem 0.2rem;
      border-bottom: 1px solid var(--border);
    }
    .playlist-header .pl-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .playlist-header .pl-count {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .playlist-header .pl-actions button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .playlist-header .pl-actions button:hover {
      color: #f87171;
      background: rgba(248,113,113,0.08);
    }

    .playlist {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    .playlist::-webkit-scrollbar {
      width: 4px;
    }
    .playlist::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 4px;
    }
    .playlist::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid rgba(34,34,38,0.5);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .playlist-item:last-child { border-bottom: none; }
    .playlist-item:hover {
      background: rgba(110,231,183,0.04);
    }
    .playlist-item.active {
      background: rgba(110,231,183,0.08);
      border-left: 3px solid var(--accent);
    }
    .playlist-item .drag-handle {
      color: var(--muted);
      font-size: 0.8rem;
      cursor: grab;
      opacity: 0.4;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .playlist-item .drag-handle:hover { opacity: 0.8; }
    .playlist-item .pl-index {
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 24px;
      text-align: center;
      flex-shrink: 0;
    }
    .playlist-item .pl-name {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .playlist-item .pl-status {
      font-size: 0.7rem;
      color: var(--accent);
      flex-shrink: 0;
    }
    .playlist-item .pl-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      transition: all 0.2s;
      flex-shrink: 0;
      opacity: 0.4;
    }
    .playlist-item:hover .pl-remove { opacity: 0.8; }
    .playlist-item .pl-remove:hover {
      color: #f87171;
      background: rgba(248,113,113,0.1);
      opacity: 1;
    }
    .playlist-item.dragging {
      opacity: 0.4;
      background: rgba(110,231,183,0.08);
    }
    .playlist-item.drag-over {
      border-top: 2px solid var(--accent);
    }

    .empty-playlist {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .empty-playlist .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    .status-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
      padding: 0.3rem;
      min-height: 1.6rem;
    }

    @media (max-width: 600px) {
      .container { padding: 1rem; margin-top: 0; }
      .controls { gap: 0.4rem; }
      .controls button.play-btn { width: 40px; height: 40px; font-size: 1.5rem; }
      .controls .time-label { min-width: 36px; font-size: 0.6rem; }
      .playlist { max-height: 200px; }
      .playlist-item { padding: 0.4rem 0.6rem; }
      .playlist-item .pl-name { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="title">🎵 Music Player</div>
    <a href="index.html" class="back-link">← Kembali</a>
  </div>

  <!-- UPLOAD -->
  <div class="upload-area">
    <label class="upload-btn" id="uploadBtn">
      📤 Upload lagu (bisa banyak sekaligus)
      <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac,.flac" multiple />
    </label>
  </div>

  <!-- NOW PLAYING -->
  <div class="now-playing" id="nowPlaying">
    <div class="cover-icon" id="coverIcon">🎵</div>
    <div class="info">
      <div class="name" id="nowPlayingName">Belum ada lagu</div>
      <div class="status" id="nowPlayingStatus">💡 Upload lagu untuk memulai</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button id="prevBtn" title="Lagu sebelumnya">⏮</button>
    <button class="play-btn" id="playBtn" title="Putar/Jeda">▶️</button>
    <button id="nextBtn" title="Lagu berikutnya">⏭</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <span class="time-label" id="timeLabel">0:00</span>
  </div>

  <!-- VOLUME -->
  <div class="volume-section">
    <button class="vol-icon" id="muteBtn" title="Mute/Unmute">🔊</button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
  </div>

  <!-- PLAYLIST -->
  <div class="playlist-header">
    <span class="pl-title">📋 Playlist</span>
    <div class="pl-actions">
      <span class="pl-count" id="playlistCount">0 lagu</span>
      <button id="clearPlaylistBtn" title="Hapus semua lagu">✕ Hapus semua</button>
    </div>
  </div>
  <div class="playlist" id="playlistContainer">
    <div class="empty-playlist">
      <div class="icon">🎵</div>
      <p>Belum ada lagu di playlist</p>
      <p style="font-size:0.75rem;margin-top:0.3rem;">Upload lagu untuk mulai mendengarkan</p>
    </div>
  </div>

  <div class="status-text" id="statusText">💡 Upload lagu atau drag & drop ke sini</div>
</div>

<script>
// ================================================================
// MUSIC PLAYER — DENGAN PLAYLIST
// ================================================================

// ===== DOM REFS =====
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const nowPlayingName = document.getElementById('nowPlayingName');
const nowPlayingStatus = document.getElementById('nowPlayingStatus');
const coverIcon = document.getElementById('coverIcon');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressBar = document.getElementById('progressBar');
const progressWrap = document.getElementById('progressWrap');
const timeLabel = document.getElementById('timeLabel');
const volumeSlider = document.getElementById('volumeSlider');
const muteBtn = document.getElementById('muteBtn');
const statusText = document.getElementById('statusText');
const playlistContainer = document.getElementById('playlistContainer');
const playlistCount = document.getElementById('playlistCount');
const clearPlaylistBtn = document.getElementById('clearPlaylistBtn');

// ===== STATE =====
let playlist = []; // array of { id, name, url, file }
let currentIndex = -1;
let audio = null;
let isPlaying = false;
let isMuted = false;
let isDragging = false;
let dragStartIndex = null;

// ===== FUNGSI =====
function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

function updatePlaylistUI() {
  if (playlist.length === 0) {
    playlistContainer.innerHTML = `
      <div class="empty-playlist">
        <div class="icon">🎵</div>
        <p>Belum ada lagu di playlist</p>
        <p style="font-size:0.75rem;margin-top:0.3rem;">Upload lagu untuk mulai mendengarkan</p>
      </div>
    `;
    playlistCount.textContent = '0 lagu';
    return;
  }

  let html = '';
  playlist.forEach((item, index) => {
    const isActive = (index === currentIndex);
    html += `
      <div class="playlist-item ${isActive ? 'active' : ''}" 
           data-index="${index}" 
           draggable="true"
           data-id="${item.id}">
        <span class="drag-handle">⠿</span>
        <span class="pl-index">${index + 1}</span>
        <span class="pl-name">${item.name}</span>
        ${isActive ? `<span class="pl-status">${isPlaying ? '▶️' : '⏸️'}</span>` : ''}
        <button class="pl-remove" data-index="${index}" title="Hapus lagu">✕</button>
      </div>
    `;
  });
  playlistContainer.innerHTML = html;
  playlistCount.textContent = `${playlist.length} lagu`;

  // Event listeners untuk tombol hapus
  document.querySelectorAll('.pl-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.index);
      removeFromPlaylist(idx);
    });
  });

  // Event listeners untuk klik item (play)
  document.querySelectorAll('.playlist-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.pl-remove')) return;
      const idx = parseInt(el.dataset.index);
      playAtIndex(idx);
    });
  });

  // Drag & Drop
  document.querySelectorAll('.playlist-item').forEach(el => {
    el.addEventListener('dragstart', handleDragStart);
    el.addEventListener('dragend', handleDragEnd);
    el.addEventListener('dragover', handleDragOver);
    el.addEventListener('dragenter', handleDragEnter);
    el.addEventListener('dragleave', handleDragLeave);
    el.addEventListener('drop', handleDrop);
  });
}

function loadAudioFromPlaylist(index) {
  if (index < 0 || index >= playlist.length) return;
  const item = playlist[index];
  if (!item.url) return;

  if (audio) {
    audio.pause();
    URL.revokeObjectURL(audio.src);
    audio.removeEventListener('timeupdate', updateProgress);
    audio.removeEventListener('ended', onEnded);
  }

  audio = new Audio(item.url);
  audio.volume = parseFloat(volumeSlider.value);
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('ended', onEnded);
  audio.addEventListener('loadedmetadata', () => {
    timeLabel.textContent = formatTime(0);
  });
  audio.addEventListener('error', (e) => {
    statusText.textContent = '❌ Error memutar: ' + (audio?.error?.message || 'unknown');
  });

  currentIndex = index;
  nowPlayingName.textContent = item.name;
  coverIcon.textContent = '🎵';
  nowPlayingStatus.textContent = '⏸️ Dijeda';
  nowPlayingStatus.className = 'status paused';
  updatePlaylistUI();

  // Auto play
  isPlaying = false;
  togglePlay();
}

function playAtIndex(index) {
  if (index < 0 || index >= playlist.length) return;
  if (currentIndex === index && audio) {
    // Jika lagu yang sama, toggle play
    togglePlay();
    return;
  }
  loadAudioFromPlaylist(index);
}

function togglePlay() {
  if (!audio || playlist.length === 0) {
    statusText.textContent = '⚠️ Upload lagu terlebih dahulu!';
    return;
  }
  if (isPlaying) {
    audio.pause();
    playBtn.textContent = '▶️';
    nowPlayingStatus.textContent = '⏸️ Dijeda';
    nowPlayingStatus.className = 'status paused';
    statusText.textContent = `⏸️ Dijeda: ${playlist[currentIndex]?.name || ''}`;
    isPlaying = false;
  } else {
    audio.play().catch(e => {
      statusText.textContent = '⚠️ Gagal memutar: ' + e.message;
    });
    playBtn.textContent = '⏸️';
    nowPlayingStatus.textContent = '▶️ Sedang diputar';
    nowPlayingStatus.className = 'status playing';
    statusText.textContent = `▶️ Memutar: ${playlist[currentIndex]?.name || ''}`;
    isPlaying = true;
  }
  updatePlaylistUI();
}

function nextTrack() {
  if (playlist.length === 0) return;
  const nextIdx = (currentIndex + 1) % playlist.length;
  if (nextIdx === currentIndex && playlist.length === 1) {
    // Reset lagu yang sama
    if (audio) { audio.currentTime = 0; }
    return;
  }
  loadAudioFromPlaylist(nextIdx);
}

function prevTrack() {
  if (playlist.length === 0) return;
  const prevIdx = (currentIndex - 1 + playlist.length) % playlist.length;
  loadAudioFromPlaylist(prevIdx);
}

function onEnded() {
  isPlaying = false;
  playBtn.textContent = '▶️';
  progressBar.style.width = '100%';
  timeLabel.textContent = formatTime(audio?.duration || 0);
  nowPlayingStatus.textContent = '⏹️ Selesai';
  nowPlayingStatus.className = 'status';
  statusText.textContent = '⏹️ Lagu selesai';
  updatePlaylistUI();
  // Auto next
  if (playlist.length > 1) {
    setTimeout(() => {
      nextTrack();
    }, 500);
  }
}

function updateProgress() {
  if (!audio || !audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressBar.style.width = pct + '%';
  timeLabel.textContent = formatTime(audio.currentTime);
}

function addToPlaylist(files) {
  let added = 0;
  for (const file of files) {
    if (!file.type.startsWith('audio/')) continue;
    const url = URL.createObjectURL(file);
    playlist.push({
      id: generateId(),
      name: file.name,
      url: url,
      file: file
    });
    added++;
  }
  if (added === 0) {
    statusText.textContent = '⚠️ Tidak ada file audio yang valid';
    return;
  }
  statusText.textContent = `✅ ${added} lagu ditambahkan ke playlist`;
  if (playlist.length === added) {
    // Pertama kali upload, langsung mainkan lagu pertama
    loadAudioFromPlaylist(0);
  } else {
    updatePlaylistUI();
  }
}

function removeFromPlaylist(index) {
  if (index < 0 || index >= playlist.length) return;
  const item = playlist[index];
  if (item.url) URL.revokeObjectURL(item.url);
  playlist.splice(index, 1);
  if (playlist.length === 0) {
    if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); audio = null; }
    currentIndex = -1;
    isPlaying = false;
    nowPlayingName.textContent = 'Belum ada lagu';
    nowPlayingStatus.textContent = '💡 Upload lagu untuk memulai';
    nowPlayingStatus.className = 'status';
    playBtn.textContent = '▶️';
    progressBar.style.width = '0%';
    timeLabel.textContent = '0:00';
    coverIcon.textContent = '🎵';
    statusText.textContent = '🗑️ Semua lagu dihapus';
    updatePlaylistUI();
    return;
  }
  if (index < currentIndex) {
    currentIndex--;
  } else if (index === currentIndex) {
    // Lagu yang sedang diputar dihapus
    if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); audio = null; }
    isPlaying = false;
    playBtn.textContent = '▶️';
    if (currentIndex >= playlist.length) {
      currentIndex = playlist.length - 1;
    }
    loadAudioFromPlaylist(currentIndex);
  }
  updatePlaylistUI();
}

function clearPlaylist() {
  playlist.forEach(item => { if (item.url) URL.revokeObjectURL(item.url); });
  playlist = [];
  if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); audio = null; }
  currentIndex = -1;
  isPlaying = false;
  nowPlayingName.textContent = 'Belum ada lagu';
  nowPlayingStatus.textContent = '💡 Upload lagu untuk memulai';
  nowPlayingStatus.className = 'status';
  playBtn.textContent = '▶️';
  progressBar.style.width = '0%';
  timeLabel.textContent = '0:00';
  coverIcon.textContent = '🎵';
  statusText.textContent = '🗑️ Playlist dikosongkan';
  updatePlaylistUI();
}

// ===== DRAG & DROP =====
let dragOverIndex = null;

function handleDragStart(e) {
  const idx = parseInt(this.dataset.index);
  dragStartIndex = idx;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', idx);
}

function handleDragEnd(e) {
  this.classList.remove('dragging');
  document.querySelectorAll('.playlist-item.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function handleDragEnter(e) {
  e.preventDefault();
  const idx = parseInt(this.dataset.index);
  if (idx !== dragStartIndex) {
    this.classList.add('drag-over');
    dragOverIndex = idx;
  }
}

function handleDragLeave(e) {
  this.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  this.classList.remove('drag-over');
  const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
  const toIndex = parseInt(this.dataset.index);
  if (isNaN(fromIndex) || isNaN(toIndex) || fromIndex === toIndex) return;
  // Reorder
  const [moved] = playlist.splice(fromIndex, 1);
  const newIndex = fromIndex < toIndex ? toIndex - 1 : toIndex;
  playlist.splice(newIndex, 0, moved);
  // Update currentIndex
  if (currentIndex === fromIndex) currentIndex = newIndex;
  else if (fromIndex < currentIndex && toIndex >= currentIndex) currentIndex--;
  else if (fromIndex > currentIndex && toIndex <= currentIndex) currentIndex++;
  updatePlaylistUI();
  statusText.textContent = `↕️ Urutan playlist diubah`;
}

// ===== EVENT LISTENERS =====
fileInput.addEventListener('change', function(e) {
  const files = e.target.files;
  if (files.length > 0) {
    addToPlaylist(files);
  }
  this.value = '';
});

playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', nextTrack);
prevBtn.addEventListener('click', prevTrack);

// Progress bar click
progressWrap.addEventListener('click', function(e) {
  if (!audio || !audio.duration) return;
  const rect = this.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const pct = Math.min(1, Math.max(0, x / rect.width));
  audio.currentTime = pct * audio.duration;
});

// Volume
volumeSlider.addEventListener('input', function() {
  if (audio) audio.volume = parseFloat(this.value);
  if (isMuted) {
    isMuted = false;
    muteBtn.textContent = '🔊';
    if (audio) audio.muted = false;
  }
});

muteBtn.addEventListener('click', function() {
  if (!audio) return;
  isMuted = !isMuted;
  audio.muted = isMuted;
  muteBtn.textContent = isMuted ? '🔇' : '🔊';
});

clearPlaylistBtn.addEventListener('click', () => {
  if (playlist.length === 0) return;
  if (confirm('Hapus semua lagu dari playlist?')) {
    clearPlaylist();
  }
});

// Keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); nextTrack(); }
  if (e.key === 'ArrowLeft' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); prevTrack(); }
});

// Drag & Drop ke container
const container = document.querySelector('.container');
container.addEventListener('dragover', (e) => {
  e.preventDefault();
  container.style.borderColor = 'var(--accent)';
});
container.addEventListener('dragleave', () => {
  container.style.borderColor = 'var(--border)';
});
container.addEventListener('drop', (e) => {
  e.preventDefault();
  container.style.borderColor = 'var(--border)';
  const files = e.dataTransfer.files;
  if (files.length > 0) {
    addToPlaylist(files);
  } else {
    statusText.textContent = '⚠️ Tolong drag file audio!';
  }
});

// Cleanup
window.addEventListener('beforeunload', () => {
  playlist.forEach(item => { if (item.url) URL.revokeObjectURL(item.url); });
  if (audio) URL.revokeObjectURL(audio.src);
});

// ===== INIT =====
updatePlaylistUI();
console.log('🎵 Music Player dengan Playlist siap! Upload lagu atau drag & drop.');
</script>
