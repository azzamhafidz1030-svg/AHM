<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio — Azzam Hafidz Murobbi</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0C0C0E;
      --surface: #141416;
      --border:  #222226;
      --accent:  #6EE7B7;
      --accent2: #818CF8;
      --text:    #E4E4E7;
      --muted:   #71717A;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 6vw;
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      background: rgba(12,12,14,.78);
    }
    .nav-logo {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.15rem;
      color: var(--accent); letter-spacing: .04em; text-decoration: none;
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      color: var(--muted); text-decoration: none; font-size: .875rem; font-weight: 500;
      transition: color .25s; position: relative;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px;
      background: var(--accent); transition: width .3s ease;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.blog-link { color: var(--accent); font-weight: 700; }

    /* HERO */
    .hero {
      min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
      padding: 8rem 6vw 5rem; position: relative;
    }
    .hero-tag {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .72rem; font-weight: 500; letter-spacing: .12em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 1.6rem;
      opacity: 0; animation: fadeUp .7s ease forwards .15s;
    }
    .hero-tag span { width: 28px; height: 1px; background: var(--accent); display: block; }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.3rem, 6.5vw, 5.2rem);
      font-weight: 800; line-height: 1.1; letter-spacing: -.02em;
      margin-bottom: .7rem; max-width: 18ch;
    }
    .hero h1 .name-word {
      display: inline-block; opacity: 0; transform: translateY(42px);
      animation: nameReveal .85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-right: 0.22em;
    }
    .hero h1 .name-word.gradient {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    @keyframes nameReveal { to { opacity: 1; transform: translateY(0); } }
    .hero-subtitle {
      font-family: 'Syne', sans-serif; font-size: clamp(1rem, 2.4vw, 1.4rem);
      font-weight: 600; color: var(--muted); letter-spacing: .18em;
      text-transform: uppercase; margin-bottom: 1.5rem;
      opacity: 0; animation: fadeUp .7s ease forwards 1.15s;
    }
    .hero-sub {
      font-size: 1.08rem; color: var(--muted); max-width: 42ch;
      margin-bottom: 2.6rem; font-weight: 300;
      opacity: 0; animation: fadeUp .7s ease forwards 1.35s;
    }
    .hero-cta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      opacity: 0; animation: fadeUp .7s ease forwards 1.55s;
    }
    .btn {
      display: inline-block; padding: .78rem 1.85rem; border-radius: 6px;
      font-size: .875rem; font-weight: 500; text-decoration: none;
      transition: all .28s ease; cursor: pointer; border: none;
    }
    .btn-primary { background: var(--accent); color: #0C0C0E; }
    .btn-primary:hover {
      background: #a7f3d0; transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(110,231,183,.25);
    }
    .btn-outline { border: 1px solid var(--border); color: var(--text); background: transparent; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-3px); }

    .blob { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: -1; }
    .blob-1 {
      width: 520px; height: 520px; background: rgba(110,231,183,.08);
      top: 8%; right: -12%; animation: drift 14s ease-in-out infinite;
    }
    .blob-2 {
      width: 400px; height: 400px; background: rgba(129,140,248,.07);
      bottom: 5%; left: 3%; animation: drift 17s ease-in-out infinite reverse;
    }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(35px,-45px); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }

    /* SECTIONS */
    section { padding: 6.5rem 6vw; }
    .section-label {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .7rem; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 1rem;
    }
    .section-label::before { content: ''; width: 18px; height: 1px; background: var(--muted); }
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.9rem, 4vw, 2.9rem);
      font-weight: 700; letter-spacing: -.01em; margin-bottom: 3rem;
    }

    /* ABOUT - FOTO LEBIH BESAR */
    .about-grid {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 4.5rem;
      align-items: center;
    }
    .about-img-wrap { position: relative; padding-bottom: 40px; }
    .about-img-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .about-img-placeholder img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .7s ease;
    }
    .about-img-wrap:hover .about-img-placeholder img { transform: scale(1.05); }
    .about-accent-box {
      position: absolute; bottom: 0; right: -1.2rem;
      background: var(--accent); color: #0C0C0E;
      padding: .8rem 1.3rem; border-radius: 8px;
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: .95rem;
      line-height: 1.7; white-space: nowrap;
      box-shadow: 0 12px 32px rgba(110,231,183,.28);
      animation: floatBox 4s ease-in-out infinite;
    }
    .about-accent-box small { display: block; font-size: .65rem; font-weight: 500; opacity: .75; }
    @keyframes floatBox { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .about-text p { color: var(--muted); margin-bottom: 1.1rem; font-weight: 300; }
    .skills-chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.8rem; }
    .chip {
      padding: .32rem .85rem; border: 1px solid var(--border); border-radius: 100px;
      font-size: .75rem; color: var(--muted); transition: all .25s;
    }
    .chip:hover {
      border-color: var(--accent); color: var(--accent);
      background: rgba(110,231,183,.07); transform: translateY(-2px);
    }

    /* PROJECTS */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.6rem;
    }
    .project-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; text-decoration: none; color: inherit;
      display: flex; flex-direction: column;
      transition: border-color .3s, transform .4s cubic-bezier(0.16,1,0.3,1), box-shadow .4s;
      opacity: 0; transform: translateY(50px);
    }
    .project-card.visible { opacity: 1; transform: translateY(0); }
    .project-card:hover {
      border-color: rgba(110,231,183,.5); transform: translateY(-10px);
      box-shadow: 0 22px 45px rgba(0,0,0,.45);
    }
    .project-thumb {
      aspect-ratio: 16/9; background: var(--bg); border-bottom: 1px solid var(--border);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .project-thumb img {
      width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease;
    }
    .project-card:hover .project-thumb img { transform: scale(1.08); }
    .project-thumb .fallback { font-size: 2.8rem; color: var(--muted); transition: transform .4s, color .3s; }
    .project-card:hover .project-thumb .fallback { transform: scale(1.15); color: var(--accent); }
    .project-body { padding: 1.4rem 1.5rem 1.5rem; flex: 1; display: flex; flex-direction: column; }
    .project-tag {
      font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--accent); font-weight: 600; margin-bottom: .45rem;
    }
    .project-title {
      font-family: 'Syne', sans-serif; font-size: 1.18rem; font-weight: 700;
      margin-bottom: .5rem; transition: color .25s;
    }
    .project-card:hover .project-title { color: var(--accent); }
    .project-desc {
      font-size: .875rem; color: var(--muted); font-weight: 300;
      margin-bottom: 1.1rem; line-height: 1.55; flex: 1;
    }
    .project-link {
      font-size: .78rem; font-weight: 500; color: var(--muted);
      transition: color .25s, transform .25s; display: inline-flex; align-items: center; gap: .3rem;
    }
    .project-card:hover .project-link { color: var(--accent); transform: translateX(4px); }

    /* EXPERIENCE */
    .exp-list { max-width: 700px; margin: 0 auto; position: relative; }
    .exp-list::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
      background: linear-gradient(to bottom, var(--accent), var(--border));
    }
    .exp-item {
      display: grid; grid-template-columns: 150px 1fr; gap: 2rem;
      padding: 1.9rem 0 1.9rem 2.6rem; position: relative;
    }
    .exp-item::before {
      content: ''; position: absolute; left: -5px; top: 2.15rem;
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--bg); border: 2px solid var(--accent);
      box-shadow: 0 0 0 4px rgba(110,231,183,.15); transition: transform .3s, box-shadow .3s;
    }
    .exp-item:hover::before {
      transform: scale(1.25); box-shadow: 0 0 0 6px rgba(110,231,183,.25);
    }
    .exp-year { font-size: .75rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; padding-top: .15rem; }
    .exp-role { font-family: 'Syne', sans-serif; font-size: 1.08rem; font-weight: 700; margin-bottom: .2rem; }
    .exp-company { color: var(--accent); font-size: .875rem; margin-bottom: .45rem; }
    .exp-desc { font-size: .875rem; color: var(--muted); font-weight: 300; }

    /* CONTACT */
    .contact-wrap { max-width: 620px; margin: 0 auto; text-align: center; }
    .contact-intro { color: var(--muted); font-weight: 300; margin-bottom: 2.8rem; font-size: 1.05rem; }
    .contact-links { display: flex; flex-direction: column; gap: .9rem; text-align: left; }
    .contact-link {
      display: flex; align-items: center; gap: 1rem; padding: 1.2rem 1.5rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      text-decoration: none; color: var(--text);
      transition: border-color .3s, transform .3s, box-shadow .3s;
    }
    .contact-link:hover {
      border-color: var(--accent); transform: translateX(8px);
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }
    .contact-icon { font-size: 1.25rem; width: 30px; text-align: center; }
    .contact-link-text strong { display: block; font-weight: 500; font-size: .95rem; }
    .contact-link-text span { font-size: .8rem; color: var(--muted); }
    .contact-link-arrow { margin-left: auto; color: var(--muted); font-size: 1.15rem; transition: color .25s, transform .25s; }
    .contact-link:hover .contact-link-arrow { color: var(--accent); transform: translateX(4px); }

    footer {
      border-top: 1px solid var(--border); padding: 2rem 6vw;
      display: flex; justify-content: space-between; align-items: center;
      font-size: .8rem; color: var(--muted); flex-wrap: wrap; gap: 1rem;
    }

    .reveal { opacity: 0; transform: translateY(40px); transition: opacity .75s ease, transform .75s ease; }
    .reveal.visible { opacity: 1; transform: none; }

    /* MUSIC + CLOCK + AI (sama seperti sebelumnya) */
    .music-player { position: fixed; bottom: 2rem; right: 2rem; z-index: 999; }
    .music-toggle {
      width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #0C0C0E;
      border: none; font-size: 1.55rem; cursor: pointer;
      box-shadow: 0 8px 28px rgba(110,231,183,.35); transition: all .3s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .music-toggle:hover { transform: scale(1.12); box-shadow: 0 14px 36px rgba(110,231,183,.5); }
    .music-toggle.active { background: var(--bg); color: var(--accent); border: 1px solid var(--border); }
    .music-panel {
      position: absolute; bottom: 72px; right: 0; width: 320px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.2rem; box-shadow: 0 24px 50px rgba(0,0,0,.75);
      transform: scale(.9) translateY(18px); opacity: 0; visibility: hidden;
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: bottom right;
    }
    .music-panel.open { transform: scale(1) translateY(0); opacity: 1; visibility: visible; }
    .music-panel .file-info { font-size: .8rem; color: var(--muted); margin-bottom: .6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .music-panel .file-info strong { color: var(--text); }
    .music-panel .upload-btn {
      display: block; background: var(--bg); border: 1px dashed var(--border); border-radius: 8px;
      padding: .45rem 1rem; font-size: .75rem; color: var(--muted); cursor: pointer;
      transition: all .2s; width: 100%; text-align: center; margin-bottom: .9rem;
    }
    .music-panel .upload-btn:hover { border-color: var(--accent); color: var(--accent); }
    .music-panel .upload-btn input { display: none; }
    .music-controls { display: flex; align-items: center; gap: .5rem; }
    .music-controls button { background: none; border: none; color: var(--text); font-size: 1.25rem; cursor: pointer; padding: .2rem .35rem; transition: color .2s; }
    .music-controls button:hover { color: var(--accent); }
    .music-controls .progress-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 4px; cursor: pointer; }
    .music-controls .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 4px; transition: width .1s linear; }
    .music-controls .time-label { font-size: .65rem; color: var(--muted); min-width: 36px; text-align: center; }
    .music-controls .volume-wrap { display: flex; align-items: center; gap: .3rem; }
    .music-controls .volume-wrap input[type="range"] { width: 52px; accent-color: var(--accent); height: 3px; cursor: pointer; }

    .floating-clock {
      position: fixed; bottom: 2rem; left: 2rem; z-index: 999;
      background: var(--surface); border: 1px solid var(--border); border-radius: 100px;
      padding: .55rem 1.15rem; backdrop-filter: blur(12px);
      font-family: 'Inter', monospace; font-size: .88rem; font-weight: 500; color: var(--text);
      display: flex; align-items: center; gap: .7rem; box-shadow: 0 8px 24px rgba(0,0,0,.55);
      user-select: none; pointer-events: none;
    }
    .clock-time { color: var(--accent); font-weight: 600; letter-spacing: .08em; font-variant-numeric: tabular-nums; }

    .ai-chatbot { position: fixed; bottom: 6.2rem; right: 2rem; z-index: 999; }
    .ai-avatar-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: 2px solid var(--accent); cursor: pointer;
      box-shadow: 0 8px 26px rgba(129,140,248,.4); transition: all .3s ease;
      overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .ai-avatar-btn:hover { transform: scale(1.12); box-shadow: 0 14px 36px rgba(129,140,248,.55); }
    .ai-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
    .ai-avatar-btn .avatar-fallback { font-size: 1.5rem; display: none; }
    .ai-greeting-bubble {
      position: absolute; right: 70px; bottom: 10px;
      background: var(--surface); border: 1px solid var(--accent); color: var(--text);
      padding: .5rem .85rem; border-radius: 12px; border-bottom-right-radius: 3px;
      font-size: .75rem; white-space: nowrap; box-shadow: 0 8px 22px rgba(0,0,0,.5);
      animation: popIn .35s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer;
    }
    @keyframes popIn { from { opacity: 0; transform: translateX(12px) scale(.9); } to { opacity: 1; transform: translateX(0) scale(1); } }
    .ai-chat-panel {
      position: absolute; bottom: 72px; right: 0; width: 340px; height: 480px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 24px 50px rgba(0,0,0,.75); display: flex; flex-direction: column;
      transform: scale(.9) translateY(18px); opacity: 0; visibility: hidden;
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: bottom right; overflow: hidden;
    }
    .ai-chat-panel.open { transform: scale(1) translateY(0); opacity: 1; visibility: visible; }
    .ai-chat-header {
      padding: .9rem 1.15rem; background: rgba(20,20,22,.85); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .ai-chat-header-info { display: flex; align-items: center; gap: .55rem; }
    .status-dot {
      width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
      box-shadow: 0 0 10px var(--accent); animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .ai-chat-header h4 { font-size: .9rem; font-weight: 600; }
    .ai-chat-close { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; transition: color .2s; }
    .ai-chat-close:hover { color: var(--text); }
    .ai-chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: .75rem; }
    .msg { max-width: 85%; padding: .55rem .85rem; border-radius: 12px; font-size: .82rem; line-height: 1.45; }
    .msg.bot { background: var(--bg); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 3px; }
    .msg.user { background: var(--accent2); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
    .typing-indicator {
      display: flex; gap: 4px; padding: .55rem .85rem; background: var(--bg);
      border: 1px solid var(--border); border-radius: 12px; border-bottom-left-radius: 3px; width: fit-content;
    }
    .typing-dot {
      width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -.32s; }
    .typing-dot:nth-child(2) { animation-delay: -.16s; }
    @keyframes typingBounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
    .ai-suggestions {
      padding: .5rem .75rem; display: flex; flex-wrap: wrap; gap: .4rem;
      background: rgba(12,12,14,.5); border-top: 1px solid var(--border);
      max-height: 90px; overflow-y: auto;
    }
    .sug-chip {
      background: var(--surface); border: 1px solid var(--border); color: var(--accent);
      padding: .25rem .6rem; border-radius: 100px; font-size: .7rem; cursor: pointer; transition: all .2s;
    }
    .sug-chip:hover { border-color: var(--accent); background: var(--border); }
    .ai-chat-input-area {
      padding: .7rem .75rem; border-top: 1px solid var(--border); display: flex; gap: .4rem;
    }
    .ai-chat-input-area input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: .5rem .8rem; color: var(--text); font-size: .8rem; outline: none;
    }
    .ai-chat-input-area input:focus { border-color: var(--accent2); }
    .ai-chat-input-area button {
      background: var(--accent2); border: none; color: #fff; border-radius: 8px;
      padding: .5rem .8rem; font-size: .85rem; cursor: pointer; transition: opacity .2s;
    }
    .ai-chat-input-area button:hover { opacity: .9; }

    @media (max-width: 900px) {
      .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
      .about-img-wrap { max-width: 340px; margin: 0 auto; }
      .exp-item { grid-template-columns: 1fr; gap: .4rem; padding-left: 1.9rem; }
      nav .nav-links { display: none; }
      .projects-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .music-panel { width: 280px; right: -6px; }
      .floating-clock { bottom: 6.2rem; left: 1rem; padding: .4rem .9rem; font-size: .75rem; }
      .ai-chatbot { bottom: 6.2rem; right: 1rem; }
      .ai-chat-panel { width: 300px; right: -6px; }
      .ai-greeting-bubble { display: none; }
    }
  </style>
</head>

<script>
  // ... (script reveal, music, clock sama) ...

  // ===================== AI YANG LEBIH PINTAR =====================
  function generateAiResponse(input) {
    const text = input.toLowerCase().trim();
    let reply = "";
    let nextChips = "";

    // Jawaban panjang & natural untuk topik portofolio
