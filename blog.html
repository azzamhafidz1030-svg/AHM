<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📝 Blog — Azzam Hafidz Murobbi</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0C0C0E;--surface:#141416;--border:#222226;--accent:#6EE7B7;--accent2:#818CF8;--text:#E4E4E7;--muted:#71717A;--gold:#fbbf24}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;line-height:1.7;min-height:100vh;overflow-x:hidden}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 6vw;backdrop-filter:blur(12px);border-bottom:1px solid var(--border);background:rgba(12,12,14,.85)}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:var(--accent);text-decoration:none}
.nav-right{display:flex;gap:0.8rem;align-items:center}
.nav-link{color:var(--muted);text-decoration:none;font-size:.85rem;font-weight:500;transition:color .2s}
.nav-link:hover{color:var(--accent)}
.btn-admin{background:var(--accent);color:#0C0C0E;padding:.4rem 1rem;border-radius:6px;font-weight:700;text-decoration:none;font-size:.8rem;transition:all .2s}
.btn-admin:hover{background:#a7f3d0;transform:scale(1.02)}

.page-hero{padding:8rem 6vw 3rem;border-bottom:1px solid var(--border);text-align:center}
.page-tag{display:inline-flex;align-items:center;gap:.5rem;font-size:.75rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem}
.page-tag span{width:24px;height:1px;background:var(--accent)}
.page-hero h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:800;line-height:1.1;margin-bottom:.75rem}
.page-hero p{color:var(--muted);max-width:50ch;font-weight:300;font-size:1.05rem;margin:0 auto}

.blog-wrap{padding:2rem 6vw 4rem;max-width:900px;margin:0 auto}

.search-bar{margin-bottom:2rem;display:flex;gap:0.5rem}
.search-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.8rem 1.2rem;font-size:0.95rem;color:var(--text);font-family:inherit;transition:border-color .2s}
.search-input:focus{outline:none;border-color:var(--accent)}

.empty{text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty .icon{font-size:4rem;margin-bottom:1rem;opacity:0.5}
.empty h3{font-family:'Syne',sans-serif;font-size:1.3rem;color:var(--text);margin-bottom:0.5rem}
.empty p{margin-bottom:1.5rem;font-size:0.9rem}

.blog-grid{display:grid;grid-template-columns:1fr;gap:1.2rem}
.blog-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;transition:all .2s;cursor:pointer;display:block;text-decoration:none;color:inherit}
.blog-card:hover{border-color:rgba(110,231,183,.5);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.blog-meta{display:flex;gap:0.8rem;flex-wrap:wrap;margin-bottom:0.8rem;font-size:0.75rem;align-items:center}
.blog-kategori{padding:0.2rem 0.6rem;background:rgba(110,231,183,0.1);border:1px solid rgba(110,231,183,0.3);border-radius:100px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.blog-tanggal{color:var(--muted)}
.blog-card h2{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:0.5rem;line-height:1.3}
.blog-card .excerpt{color:var(--muted);font-size:0.9rem;margin-bottom:0.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blog-read{font-size:0.8rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:0.3rem}

/* MODAL BACA */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;opacity:0;pointer-events:none;transition:opacity .3s;overflow-y:auto}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:720px;transform:translateY(30px);transition:transform .3s;overflow:hidden;margin:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{padding:2rem 2rem 1.5rem;border-bottom:1px solid var(--border);position:relative}
.modal-close{position:absolute;top:1.5rem;right:1.5rem;background:var(--border);border:none;color:var(--muted);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--accent);color:#0C0C0E}
.modal-kategori{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:0.75rem}
.modal-title{font-family:'Syne',sans-serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:800;line-height:1.2;margin-bottom:0.5rem;padding-right:2.5rem}
.modal-date{font-size:0.8rem;color:var(--muted)}
.modal-body{padding:2rem;color:var(--muted);font-size:0.95rem;line-height:1.8}
.modal-body h2,.modal-body h3{color:var(--text);font-family:'Syne',sans-serif;margin:1.5rem 0 0.75rem}
.modal-body h2{font-size:1.4rem}
.modal-body h3{font-size:1.1rem}
.modal-body p{margin-bottom:1rem}
.modal-body ul,.modal-body ol{padding-left:1.5rem;margin-bottom:1rem}
.modal-body li{margin-bottom:0.4rem}
.modal-body strong{color:var(--text)}
.modal-body a{color:var(--accent)}

footer{border-top:1px solid var(--border);padding:2rem 6vw;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);flex-wrap:wrap;gap:1rem}
footer a{color:var(--muted);text-decoration:none;transition:color .2s}
footer a:hover{color:var(--accent)}

@media(max-width:768px){
  .page-hero{padding:7rem 1.5rem 2rem}
  .blog-wrap{padding:1.5rem 1.5rem 3rem}
  .nav-link.hide-mobile{display:none}
  .modal-header,.modal-body{padding:1.5rem}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">AHM.</a>
  <div class="nav-right">
    <a href="index.html" class="nav-link hide-mobile">← Portfolio</a>
    <a href="blog-admin.html" class="btn-admin">✏️ Tulis</a>
  </div>
</nav>

<div class="page-hero">
  <p class="page-tag"><span></span> Tulisan & Cerita</p>
  <h1>📝 Blog Azzam</h1>
  <p>Catatan, cerita, dan pemikiran seputar sejarah, militer, bahasa, dan coding.</p>
</div>

<div class="blog-wrap">
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Cari artikel…" />
  </div>

  <div id="blogList"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-kategori" id="modalKategori"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-date" id="modalDate"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer>
  <span>© 2024 Azzam Hafidz Murobbi</span>
  <a href="index.html">← Kembali ke Portfolio</a>
</footer>
